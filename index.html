<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuntes · ASIR · DAM · DAW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #f0ede6;
    --text: #21262b;
    --muted: #656d76;
    --accent: #2f7d6c;
    --accent-soft: #e3f0ec;
    --border: #ddd8cd;
    --code-bg: #eee9dd;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161a;
      --surface: #181d23;
      --surface-2: #1e242b;
      --text: #e7e9ea;
      --muted: #8b95a1;
      --accent: #5fbfae;
      --accent-soft: #1c2e2b;
      --border: #262c33;
      --code-bg: #1d232a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161a;
    --surface: #181d23;
    --surface-2: #1e242b;
    --text: #e7e9ea;
    --muted: #8b95a1;
    --accent: #5fbfae;
    --accent-soft: #1c2e2b;
    --border: #262c33;
    --code-bg: #1d232a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  a { color: var(--accent); }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100%;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 14px 40px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 13px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin: 4px 4px 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand h1 span { color: var(--accent); }
  .theme-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    padding: 4px 7px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  .search {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-family: var(--mono);
    font-size: 12.5px;
    margin: 0 4px 16px;
    width: calc(100% - 8px);
  }
  .search:focus { outline: none; border-color: var(--accent); }

  details.titulacion { margin: 0 0 2px; }
  details.titulacion > summary {
    font-weight: 700;
    font-size: 13.5px;
    padding: 7px 6px;
    border-radius: 5px;
    cursor: pointer;
    list-style: none;
  }
  details.titulacion > summary::-webkit-details-marker { display: none; }
  details.titulacion > summary::before {
    content: "▸";
    display: inline-block;
    width: 14px;
    color: var(--muted);
    transition: transform .15s ease;
  }
  details.titulacion[open] > summary::before { transform: rotate(90deg); }
  details.titulacion > summary:hover { background: var(--surface-2); }

  details.asignatura { margin: 0 0 1px 14px; }
  details.asignatura > summary {
    font-size: 12.5px;
    color: var(--muted);
    padding: 5px 6px;
    border-radius: 5px;
    cursor: pointer;
    list-style: none;
  }
  details.asignatura > summary::-webkit-details-marker { display: none; }
  details.asignatura > summary::before {
    content: "·";
    display: inline-block;
    width: 14px;
  }
  details.asignatura > summary:hover { background: var(--surface-2); color: var(--text); }

  ul.temas { list-style: none; margin: 2px 0 6px 20px; padding: 0; }
  ul.temas li.empty {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 6px;
    font-style: italic;
    font-family: var(--serif);
  }
  ul.temas button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: 5px 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    border-radius: 5px;
    cursor: pointer;
  }
  ul.temas button:hover { background: var(--accent-soft); }
  ul.temas button.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .hidden-by-search { display: none !important; }

  /* ---------- Main ---------- */
  main {
    padding: 40px 48px 80px;
    max-width: 760px;
  }
  .breadcrumb {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .breadcrumb .accent { color: var(--accent); }

  .content h1 { font-size: 28px; line-height: 1.25; margin: 0 0 18px; }
  .content h2 { font-size: 21px; margin: 34px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .content h3 { font-size: 17px; margin: 26px 0 10px; }
  .content p, .content li { font-size: 16px; line-height: 1.7; }
  .content p { margin: 0 0 16px; }
  .content ul, .content ol { padding-left: 22px; margin: 0 0 16px; }
  .content li { margin-bottom: 6px; }
  .content code {
    font-family: var(--mono);
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 0.87em;
  }
  .content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0 0 20px;
  }
  .content pre code { background: none; padding: 0; }
  .content table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 20px;
    font-size: 14.5px;
    display: block;
    overflow-x: auto;
  }
  .content th, .content td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
  }
  .content th { background: var(--surface-2); font-family: var(--mono); font-size: 13px; }
  .content blockquote {
    border-left: 3px solid var(--accent);
    margin: 0 0 20px;
    padding: 2px 0 2px 16px;
    color: var(--muted);
  }
  .content img { max-width: 100%; border-radius: 6px; }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

  /* ---------- Welcome / empty states ---------- */
  .welcome h1 { font-size: 30px; }
  .welcome p { color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 60ch; }
  .welcome .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 5px;
    margin-bottom: 16px;
  }

  /* ---------- Mobile ---------- */
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      inset: 0 20% 0 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform .2s ease;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      box-shadow: 2px 0 18px rgba(0,0,0,.18);
    }
    .sidebar.open { transform: translateX(0); }
    .scrim {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 15;
    }
    .scrim.show { display: block; }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 22px;
    }
    main { padding: calc(24px + env(safe-area-inset-top,0px)) 22px 60px; }
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <h1>apuntes<span>.fp</span></h1>
      <button class="theme-btn" id="themeBtn" title="Cambiar tema">◐</button>
    </div>
    <input class="search" id="search" type="text" placeholder="Buscar tema o asignatura…">
    <div id="tree"></div>
  </nav>

  <main>
    <button class="menu-btn" id="menuBtn">☰ Índice</button>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* =========================================================
   DATOS: aquí vive todo el contenido del sitio.
   Estructura: Titulación -> Asignaturas -> Temas -> Markdown.
   Para añadir un tema nuevo, añade un objeto al array `temas`
   de la asignatura correspondiente:
   { id:'tema-x', name:'Nombre del tema', md:`# ... contenido en markdown ...` }
   ========================================================= */
const DATA = [
  { id: 'comunes', name: 'Comunes', full: 'Módulos comunes a ASIR, DAM y DAW (convalidables)', asignaturas: [
  { id: 'lmsgi', name: 'Lenguajes de Marcas y Sistemas de Gestión de Información', temas: [
  { id: 'lm-tema-1-que-son-los-lenguajes-de-marcas', name: 'Tema 1. Qué son los lenguajes de marcas', mdFile: 'temas/lm-tema-1-que-son-los-lenguajes-de-marcas.md' },
  { id: 'lm-tema-2-lenguajes-de-marcas-en-entornos-w', name: 'Tema 2. Lenguajes de marcas en entornos web', mdFile: 'temas/lm-tema-2-lenguajes-de-marcas-en-entornos-w.md' },
  { id: 'lm-tema-3-hojas-de-estilo', name: 'Tema 3. Hojas de estilo', mdFile: 'temas/lm-tema-3-hojas-de-estilo.md' },
  { id: 'lm-tema-4-lenguajes-de-script', name: 'Tema 4. Lenguajes de script', mdFile: 'temas/lm-tema-4-lenguajes-de-script.md' },
  { id: 'lm-tema-5-xml', name: 'Tema 5. XML', mdFile: 'temas/lm-tema-5-xml.md' },
  { id: 'lm-tema-6-gestion-y-almacenamiento-de-infor', name: 'Tema 6. Gestión y almacenamiento de información en XML', mdFile: 'temas/lm-tema-6-gestion-y-almacenamiento-de-infor.md' },
  { id: 'lm-tema-7-sistemas-de-gestion-empresarial', name: 'Tema 7. Sistemas de gestión empresarial', mdFile: 'temas/lm-tema-7-sistemas-de-gestion-empresarial.md' },
  { id: 'lm-tema-8-proximos-pasos', name: 'Tema 8. Próximos pasos', mdFile: 'temas/lm-tema-8-proximos-pasos.md' },
  { id: 'lm-anexo-i', name: 'Anexo I', mdFile: 'temas/lm-anexo-i.md' },
  { id: 'lm-anexo-ii-palabras-reservadas', name: 'Anexo II. Palabras reservadas', mdFile: 'temas/lm-anexo-ii-palabras-reservadas.md' },
  { id: 'lm-anexo-iii-palabras-reservadas', name: 'Anexo III. Palabras reservadas', mdFile: 'temas/lm-anexo-iii-palabras-reservadas.md' },
  { id: 'lm-anexo-iv', name: 'Anexo IV', mdFile: 'temas/lm-anexo-iv.md' },
  { id: 'lm-anexo-v', name: 'Anexo V', mdFile: 'temas/lm-anexo-v.md' },
  { id: 'lm-bibliografia-webgrafia', name: 'Bibliografía / webgrafía', mdFile: 'temas/lm-bibliografia-webgrafia.md' }
] }
] },
  { id: 'comunes-dam-daw', name: 'Comunes DAM/DAW', full: 'Módulos comunes a DAM y DAW (convalidables)', asignaturas: [
  { id: 'si-comun', name: 'Sistemas Informáticos', temas: [

] },
  { id: 'bd-comun', name: 'Bases de Datos', temas: [

] },
  { id: 'prog-comun', name: 'Programación', temas: [

] },
  { id: 'ed-comun', name: 'Entornos de Desarrollo', temas: [

] },
  { id: 'eie-comun', name: 'Empresa e Iniciativa Emprendedora', temas: [

] }
] },
  { id: 'asir', name: 'ASIR', full: 'Administración de Sistemas Informáticos en Red', asignaturas: [
  { id: 'iso', name: 'Implantación de Sistemas Operativos', temas: [

] },
  { id: 'gbd', name: 'Gestión de Bases de Datos', temas: [

] },
  { id: 'hardware', name: 'Fundamentos de Hardware', temas: [

] },
  { id: 'aso', name: 'Administración de Sistemas Operativos', temas: [

] },
  { id: 'redes', name: 'Planificación y Administración de Redes', temas: [

] },
  { id: 'srvred', name: 'Servicios de Red e Internet', temas: [

] },
  { id: 'iaw', name: 'Implantación de Aplicaciones Web', temas: [

] },
  { id: 'asgbd', name: 'Administración de Sistemas Gestores de Bases de Datos', temas: [

] },
  { id: 'sad', name: 'Seguridad y Alta Disponibilidad', temas: [

] }
] },
  { id: 'dam', name: 'DAM', full: 'Desarrollo de Aplicaciones Multiplataforma', asignaturas: [
  { id: 'ad-dam', name: 'Acceso a Datos', temas: [

] },
  { id: 'di-dam', name: 'Desarrollo de Interfaces', temas: [

] },
  { id: 'pmdm', name: 'Programación Multimedia y Dispositivos Móviles', temas: [

] },
  { id: 'psp', name: 'Programación de Servicios y Procesos', temas: [
  { id: 'psp-1-uso-de-tecnicas-de-programacion-segura', name: '1. Uso de técnicas de programación segura', mdFile: 'temas/psp-1-uso-de-tecnicas-de-programacion-segura.md' },
  { id: 'psp-2-programacion-multiproceso', name: '2. Programación multiproceso', mdFile: 'temas/psp-2-programacion-multiproceso.md' },
  { id: 'psp-3-programacion-multihilo', name: '3. Programación multihilo', mdFile: 'temas/psp-3-programacion-multihilo.md' },
  { id: 'psp-4-programacion-de-comunicaciones-en-red', name: '4. Programación de comunicaciones en red', mdFile: 'temas/psp-4-programacion-de-comunicaciones-en-red.md' },
  { id: 'psp-5-generacion-de-servicios-de-red', name: '5. Generación de servicios de red', mdFile: 'temas/psp-5-generacion-de-servicios-de-red.md' },
  { id: 'psp-bibliografia', name: 'Bibliografía', mdFile: 'temas/psp-bibliografia.md' }
] },
  { id: 'sge', name: 'Sistemas de Gestión Empresarial', temas: [

] }
] },
  { id: 'daw', name: 'DAW', full: 'Desarrollo de Aplicaciones Web', asignaturas: [
  { id: 'dwec', name: 'Desarrollo Web en Entorno Cliente', temas: [

] },
  { id: 'dwes', name: 'Desarrollo Web en Entorno Servidor', temas: [

] },
  { id: 'daweb', name: 'Despliegue de Aplicaciones Web', temas: [

] },
  { id: 'diw', name: 'Diseño de Interfaces Web', temas: [

] }
] }
];

/* ---------------- Render ---------------- */
const tree = document.getElementById('tree');
const content = document.getElementById('content');
const breadcrumb = document.getElementById('breadcrumb');

function findTema(path) {
  const [titId, asId, temaId] = path.split('/');
  const tit = DATA.find(t => t.id === titId);
  const asg = tit && tit.asignaturas.find(a => a.id === asId);
  const tema = asg && asg.temas.find(t => t.id === temaId);
  return tit && asg && tema ? { tit, asg, tema } : null;
}

function renderTree() {
  tree.innerHTML = DATA.map(tit => `
    <details class="titulacion" open data-tit="${tit.id}">
      <summary title="${tit.full}">${tit.name}</summary>
      ${tit.asignaturas.map(asg => `
        <details class="asignatura" data-asg="${asg.id}">
          <summary>${asg.name}</summary>
          <ul class="temas">
            ${asg.temas.length
              ? asg.temas.map(tema => `<li><button data-path="${tit.id}/${asg.id}/${tema.id}">${tema.name}</button></li>`).join('')
              : `<li class="empty">Sin temas aún</li>`}
          </ul>
        </details>
      `).join('')}
    </details>
  `).join('');

  tree.querySelectorAll('button[data-path]').forEach(btn => {
    btn.addEventListener('click', () => {
      location.hash = btn.dataset.path;
    });
  });
}

function showWelcome() {
  breadcrumb.textContent = '';
  document.querySelectorAll('#tree button.active').forEach(b => b.classList.remove('active'));
  content.innerHTML = `
    <div class="welcome">
      <span class="tag">apuntes.fp</span>
      <h1>Apuntes de ASIR, DAM y DAW</h1>
      <p>Elige una titulación en el índice de la izquierda, despliega la asignatura y selecciona un tema para leerlo. El contenido se va añadiendo progresivamente a medida que se estudia cada módulo — las asignaturas sin temas todavía aparecen marcadas como «Sin temas aún».</p>
    </div>`;
}

const mdCache = {};

async function showTema(path) {
  const found = findTema(path);
  if (!found) { showWelcome(); return; }
  const { tit, asg, tema } = found;

  breadcrumb.innerHTML = `<span class="accent">${tit.name}</span> / ${asg.name} / ${tema.name}`;

  document.querySelectorAll('#tree button.active').forEach(b => b.classList.remove('active'));
  const activeBtn = tree.querySelector(`button[data-path="${path}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  if (window.innerWidth <= 860) closeSidebar();

  if (mdCache[tema.mdFile]) {
    content.innerHTML = marked.parse(mdCache[tema.mdFile]);
    return;
  }

  content.innerHTML = '<p style="color:var(--muted)">Cargando…</p>';
  try {
    const res = await fetch(tema.mdFile);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    mdCache[tema.mdFile] = md;
    // Only render if the user hasn't navigated away while loading
    if (decodeURIComponent(location.hash.replace(/^#/, '')) === path) {
      content.innerHTML = typeof marked !== 'undefined'
        ? marked.parse(md)
        : '<p>No se pudo cargar el renderizador de Markdown.</p>';
    }
  } catch (err) {
    content.innerHTML = `<p style="color:var(--muted)">No se pudo cargar este tema (${err.message}). Comprueba que el archivo <code>${tema.mdFile}</code> existe junto a index.html.</p>`;
  }
}

function routeFromHash() {
  const path = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (path && findTema(path)) showTema(path);
  else showWelcome();
}

/* ---------------- Búsqueda ---------------- */
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  tree.querySelectorAll('details.asignatura').forEach(asgEl => {
    const asgName = asgEl.querySelector('summary').textContent.toLowerCase();
    const temaButtons = [...asgEl.querySelectorAll('button[data-path]')];
    const matchAsg = asgName.includes(q);
    const matchingTemas = temaButtons.filter(b => b.textContent.toLowerCase().includes(q));

    if (!q) {
      asgEl.classList.remove('hidden-by-search');
      temaButtons.forEach(b => b.parentElement.classList.remove('hidden-by-search'));
      return;
    }
    if (matchAsg) {
      asgEl.classList.remove('hidden-by-search');
      temaButtons.forEach(b => b.parentElement.classList.remove('hidden-by-search'));
      asgEl.open = true;
    } else if (matchingTemas.length) {
      asgEl.classList.remove('hidden-by-search');
      temaButtons.forEach(b => {
        b.parentElement.classList.toggle('hidden-by-search', !b.textContent.toLowerCase().includes(q));
      });
      asgEl.open = true;
    } else {
      asgEl.classList.add('hidden-by-search');
    }
  });
});

/* ---------------- Tema claro/oscuro ---------------- */
const themeBtn = document.getElementById('themeBtn');
function applyStoredTheme() {
  try {
    const saved = localStorage.getItem('apuntesfp-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
}
themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme')
    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('apuntesfp-theme', next); } catch (e) {}
});

/* ---------------- Sidebar móvil ---------------- */
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
function openSidebar() { sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', openSidebar);
scrim.addEventListener('click', closeSidebar);

/* ---------------- Init ---------------- */
applyStoredTheme();
renderTree();
window.addEventListener('hashchange', routeFromHash);
routeFromHash();
</script>
</body>
</html>
