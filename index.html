`# Tema 5. XML

XML (eXtensible Markup Language) es un lenguaje de marcado diseñado para almacenar,

estructurar y transportar datos de manera legible tanto para las máquinas como para los humanos. Desarrollado por el World Wide Web Consortium (W3C), XML se ha convertido en un estándar fundamental para el intercambio de información en aplicaciones web, bases de datos y sistemas empresariales, gracias a su flexibilidad, simplicidad y amplia compatibilidad.

A diferencia de lenguajes como HTML, que tienen etiquetas predefinidas para estructurar documentos web, XML permite a los usuarios crear sus propias etiquetas, adaptándose a las necesidades específicas de cada aplicación. Esto hace que XML sea una herramienta extremadamente versátil para representar datos jerárquicos o estructurados, como catálogos de productos, configuraciones de software o respuestas de servicios web.

La sintaxis de XML se basa en una estructura de árbol, compuesta por elementos que pueden contener texto, atributos y otros elementos anidados. Un archivo XML típico comienza con una declaración que especifica la versión y la codificación del documento, seguida de un conjunto de etiquetas que organizan la información de manera jerárquica. La validación de documentos XML puede realizarse mediante DTD (Document Type Definition) o XML Schema, que garantizan que los datos cumplan con un formato predefinido.

Entre sus principales aplicaciones destacan su uso en la comunicación entre sistemas mediante servicios web (SOAP, REST), almacenamiento de datos en bases de datos orientadas a documentos, y configuración de aplicaciones a través de archivos como config.xml. Herramientas y lenguajes como XPath, XSLT y DOM amplían las capacidades de XML, permitiendo realizar búsquedas, transformaciones y manipulaciones de datos.

XML es un pilar esencial en el intercambio de datos en el mundo digital, combinando simplicidad y potencia para garantizar la interoperabilidad entre diferentes sistemas y plataformas.

### 5.1. Qué es un documento XML

#### Características principales de XML

- **Formato basado en texto: XML utiliza un formato de texto legible** que facilita su comprensión y edición manual.
- **Estructura jerárquica: los datos se organizan en elementos ani-** dados, formando una estructura tipo árbol.
- **Extensibilidad: los usuarios pueden definir sus propias etiquetas** según las necesidades de su aplicación.
- **Separación de datos y presentación: XML se centra exclusiva-** mente en los datos, dejando su presentación a otros lenguajes como HTML o CSS.
- **Portabilidad: es independiente de la plataforma y el software, lo** que permite su uso en diferentes entornos.
#### Componentes básicos de un documento XML

- **Declaración XML: indica la versión de XML y la codificación utili-** zada. Es opcional pero recomendada. **Ejemplo:** <?xml version="1.0" encoding="UTF-8"?>
- **Elemento raíz: cada documento XML debe tener un único ele-** mento principal que contenga todos los demás elementos. **Ejemplo:** <libro> <!-- Otros elementos aquí --> </libro>
- **Elementos: representan los datos y están delimitados por etique-** tas de apertura y cierre. **Ejemplo:** <titulo>Lenguajes de Marcas</titulo>

- **Atributos: proporcionan información adicional sobre un elemento** en formato nombre="valor". **Ejemplo:** <libro id="1" categoria="educacion"> <titulo>Lenguajes de Marcas</titulo> </libro>
- **Comentarios: ayudan a documentar el código XML sin afectar su** funcionalidad. **Ejemplo:** <!-- Este es un comentario en XML -->
- **Datos de texto: son los valores que se almacenan dentro de un** elemento. **Ejemplo:** <autor>Pablo García</autor>
#### Ejemplo básico de un documento XML

<?xml version="1.0" encoding="UTF-8"?> <biblioteca> <libro id="1"> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> <año>2025</año> </libro> <libro id="2"> <titulo>Diseño Web Responsivo</titulo> <autor>Laura Sánchez</autor> <año>2023</año> </libro> </biblioteca>

#### Ventajas de XML

- **Interoperabilidad: es compatible con diferentes sistemas y tec-** nologías, facilitando el intercambio de datos.
- **Escalabilidad: su estructura jerárquica permite manejar datos** simples o complejos.

- **Legibilidad: los documentos XML son fáciles de interpretar por** humanos y máquinas.
- **Ampliamente soportado: es compatible con una amplia gama de** lenguajes de programación y herramientas.
#### Limitaciones de XML

- **Verbosidad: XML puede generar archivos grandes debido al uso** extensivo de etiquetas.
- **Rendimiento: procesar archivos XML puede ser más lento en com-** paración con formatos más compactos como JSON.
- **Curva de aprendizaje: aunque sencillo, puede ser complejo para** principiantes debido a sus reglas estrictas.
#### Usos comunes de XML

- **Intercambio de datos: XML es ampliamente utilizado en servicios** web (SOAP) y APIs para transferir información entre aplicaciones.
- **Almacenamiento de configuración: muchos programas utilizan** XML para guardar configuraciones y preferencias.
- **Bases de datos: XML puede almacenar datos estructurados en** bases de datos orientadas a documentos.
- **Representación de documentos: es útil para representar estruc-** turas complejas como libros electrónicos o manuales técnicos.
XML es un estándar versátil y ampliamente adoptado para estructurar y transportar datos. Su comprensión es esencial en el desarrollo de aplicaciones web, sistemas de intercambio de información y gestión de datos complejos.

### 5.2. Asociación con documentos XML

Un documento XML por sí solo almacena datos de manera estructurada, pero carece de una forma directa de presentación o interacción. Para que estos datos sean útiles, es común asociarlos con otros documentos o tecnologías que los procesen, interpreten o presenten. Estas asociaciones permiten visualizar, transformar y utilizar la información contenida en XML.

#### Asociación con hojas de estilo (XSL)

#### XSL (Extensible Stylesheet Language) es un lenguaje utilizado para

transformar y presentar documentos XML. La asociación de un documento XML con una hoja XSL permite generar contenido visualizado en formato HTML, PDF, u otros formatos.

#### Transformación con XSLT

#### XSLT (Extensible Stylesheet Language Transformations) es un

sublenguaje de XSL que transforma datos XML en otros formatos.

**Ejemplo:**

- Documento XML: <?xml version="1.0" encoding="UTF-8"?> <biblioteca> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro> </biblioteca>
- Documento XSL: <?xml version="1.0" encoding="UTF-8"?> <xsl:stylesheet xmlns:xsl="[http://www.w3.org/1999/](http://www.w3.org/1999/) XSL/Transform" version="1.0"> <xsl:template match="/"> <html> <body> <h1>Biblioteca</h1> <xsl:for-each select="biblioteca/libro"> <p> <strong>Título:</strong> <xsl:value-of select="titulo"/><br> <strong>Autor:</strong> <xsl:value-of select="autor"/> </p> </xsl:for-each> </body> </html> </xsl:template> </xsl:stylesheet>

El resultado será una página HTML que muestre la información de los libros.

#### Asociación con CSS

XML también puede asociarse con CSS para estilizar su contenido. Esto se logra mediante la referencia a una hoja de estilos desde el documento XML.

**Ejemplo:**

- Documento XML: <?xml version="1.0" encoding="UTF-8"?> <?xml-stylesheet type="text/css" href="estilos.css"?> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro>
- Documento CSS (estilos.css): titulo { color: blue; font-size: 20px; } autor { color: gray; font-style: italic; }
Cuando se abre el documento XML en un navegador compatible, este mostrará el texto estilizado según las reglas CSS.

#### Asociación con lenguajes de programación

Los lenguajes de programación permiten procesar y manipular datos XML para integrarlos en aplicaciones dinámicas.

#### Asociación con Java

Java incluye la biblioteca JAXP (Java API for XML Processing), que permite analizar y transformar documentos XML.

#### Ejemplo básico en Java:

import javax.xml.parsers.*; import org.w3c.dom.*;

public class LeerXML { public static void main(String[] args) throws Exception { DocumentBuilderFactory factory = Document- BuilderFactory.newInstance(); DocumentBuilder builder = factory.newDocumentBuilder(); Document doc = builder.parse("biblioteca. xml");

NodeList libros = doc.getElementsByTagName("- libro"); for (int i = 0; i < libros.getLength(); i++) { Element libro = (Element) libros.item(i); System.out.println("Título: " + libro. getElementsByTagName("titulo").item(0).getTextContent()); System.out.println("Autor: " + libro. getElementsByTagName("autor").item(0).getTextContent()); } } }

#### Asociación con JavaScript

Con JavaScript se pueden leer y manipular documentos XML en el cliente mediante DOMParser.

#### Ejemplo básico:

const xmlString = \` <biblioteca> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro> </biblioteca>\`;

const parser = new DOMParser(); const xmlDoc = parser.parseFromString(xmlString, "text/xml");

const titulo = xmlDoc.getElementsByTagName("titulo") [0].textContent; const autor = xmlDoc.getElementsByTagName("autor") [0].textContent;

console.log(\`Título: \${titulo}\`); console.log(\`Autor: \${autor}\`);

#### Asociación con bases de datos

XML se utiliza como formato de intercambio entre bases de datos o para almacenar datos estructurados en bases de datos especializadas (como BaseX o eXist-db).

#### Exportación a XML

Muchas bases de datos relacionales permiten exportar datos en formato XML para su transporte o análisis.

#### Bases de datos orientadas a documentos

Algunas bases de datos, como MongoDB, permiten almacenar datos estructurados en JSON, pero pueden exportarse e importarse como XML.

#### Usos comunes de la asociación con XML

- **Generación de contenido dinámico: transformar XML en HTML** para mostrar información en sitios web.

- **Procesamiento de datos: usar lenguajes de programación para** leer, modificar o analizar datos XML.
- **Interoperabilidad: integración de XML con servicios web y APIs** para intercambiar información entre aplicaciones.
- **Presentación personalizada: asociar XML con CSS o XSLT para** generar vistas personalizadas del contenido.
La asociación de documentos XML con hojas de estilo, lenguajes de programación y bases de datos amplía su funcionalidad y lo convierte en una herramienta versátil para estructurar, presentar y procesar datos. Gracias a estas asociaciones, XML puede integrarse fácilmente en aplicaciones web, sistemas de gestión y plataformas de intercambio de información.

### 5.3. Creación de descripciones

La creación de descripciones en documentos XML consiste en estructurar y detallar los datos mediante el uso de etiquetas y atributos que permitan identificar y representar la información de manera clara y comprensible. Estas descripciones son fundamentales para organizar los datos y garantizar que sean fácilmente interpretados tanto por humanos como por máquinas.

#### ¿Qué es una descripción en XML?

En XML, una descripción puede entenderse como la representación estructurada y detallada de un objeto, evento o entidad. Se realiza a través de etiquetas y elementos que encapsulan la información relevante.

#### Ejemplo básico:

<libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> <año>2025</año> </libro>

#### En este caso:

- El elemento <libro> describe un objeto "libro".
- Los subelementos <titulo>, <autor> y <año> proporcionan información específica sobre el libro.

#### Componentes de una descripción XML

#### Elementos: representan las categorías principales de la información.

**Ejemplo:**

<producto> <nombre>Portátil</nombre> </producto>

#### Atributos: proporcionan información adicional sobre un elemento.

**Ejemplo:**

<producto id="123" categoria="tecnologia"> <nombre>Portátil</nombre> </producto>

#### Datos de texto: es el contenido o valor almacenado dentro de un

elemento.

**Ejemplo:**

<descripcion>Un portátil de última generación.</descripcion>

#### Comentarios: se utilizan para documentar el código sin afectar su funcionalidad.

**Ejemplo:**

<!-- Este es un comentario explicativo -->

#### Ejemplo de creación de descripciones completas

#### Ejemplo de un catálogo de productos:

<?xml version="1.0" encoding="UTF-8"?> <catalogo> <producto id="101" categoria="electrodomesticos"> <nombre>Lavadora</nombre> <marca>Samsung</marca> <precio>499.99</precio> <descripcion>Lavadora automática con capacidad de 7 kg.</descripcion> </producto> <producto id="102" categoria="tecnologia"> <nombre>Smartphone</nombre>

<marca>Apple</marca> <precio>999.99</precio> <descripcion>iPhone 13 con pantalla OLED y 128 GB de almacenamiento.</descripcion> </producto> </catalogo>

#### Buenas prácticas en la creación de descripciones

#### Utilizar etiquetas descriptivas: las etiquetas deben ser claras y específicas para facilitar la comprensión.

**Ejemplo:**

<libro> <titulo>Nombre del Libro</titulo> <autor>Autor del Libro</autor> </libro>

#### Incluir atributos relevantes: utiliza atributos para añadir detalles que

no necesiten su propio elemento.

**Ejemplo:**

<usuario id="123" rol="administrador"> <nombre>Juan Pérez</nombre> </usuario>

#### Estructura jerárquica: organiza la información en niveles que representen relaciones lógicas.

**Ejemplo:**

<empresa> <departamento> <nombre>Recursos Humanos</nombre> <empleados> <empleado id="001"> <nombre>Laura Gómez</nombre> </empleado> </empleados> </departamento> </empresa>

#### Evitar redundancias: reutiliza etiquetas o atributos comunes en lugar

de duplicar información.

#### Validación: usa un esquema (DTD o XSD) para garantizar que la estructura y los datos cumplan con los requisitos.

#### Herramientas para la creación de descripciones XML

- **Editores de texto:**
#### – Visual Studio Code

#### – Notepad++

- **Editores específicos para XML:**
#### – Oxygen XML Editor

#### – XMLSpy

- **Herramientas de validación: permiten verificar la estructura y el** contenido del documento XML.
#### – W3C XML Validator

#### Aplicaciones de las descripciones en XML

- **Catálogos de productos: representar información sobre artículos** en sistemas de comercio electrónico.
- **Gestión de datos: almacenar información de empleados, clientes** o inventarios.
- **Intercambio de información: transferir datos entre sistemas,** como en servicios web.
- **Documentación: crear estructuras organizadas para libros, ma-** nuales o reportes.
La creación de descripciones en XML es una habilidad clave para estructurar y representar datos de manera clara y eficiente. Mediante el uso de etiquetas, atributos y una jerarquía bien definida, los documentos XML pueden adaptarse a una amplia variedad de aplicaciones, desde el almacenamiento de información hasta su presentación o intercambio en sistemas complejos.

### 5.4. Validación

La validación XML es el proceso de verificar que un documento XML cumple con una estructura y reglas específicas definidas por un esquema, como DTD (Document Type Definition) o XSD (XML Schema **Definition). Este proceso garantiza que los datos sean correctos, con-** sistentes y cumplan con los requisitos establecidos.

#### ¿Qué es la validación XML?

#### Es el método para comprobar que:

- El documento cumple con la sintaxis XML básica (bien formado).
- El contenido sigue las reglas definidas en un esquema externo o interno.
La validación es crucial en sistemas donde se intercambian datos estructurados, como servicios web, aplicaciones empresariales o sistemas de almacenamiento.

#### Documentos bien formados vs. válidos

- **Documento bien formado: cumple con las reglas sintácticas bá-** sicas de XML:
#### – Tiene un único elemento raíz.

#### – Las etiquetas están correctamente anidadas.

  - Todos los atributos tienen valores entre comillas.

#### Ejemplo bien formado:

<?xml version="1.0" encoding="UTF-8"?> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro>

- **Documento válido: además de estar bien formado, cumple con** las reglas definidas en un DTD o XSD.

#### Métodos de validación

#### Validación con DTD (Document Type Definition)

El DTD define la estructura de un documento XML, incluyendo los elementos, atributos y su organización. Puede incluirse de manera interna o externa.

- **DTD interno** <?xml version="1.0" encoding="UTF-8"?> <!DOCTYPE libro [ <!ELEMENT libro (titulo, autor)> <!ELEMENT titulo (#PCDATA)> <!ELEMENT autor (#PCDATA)> ]> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro>
- **DTD externo**
#### Archivo libro.dtd:

<!ELEMENT libro (titulo, autor)> <!ELEMENT titulo (#PCDATA)> <!ELEMENT autor (#PCDATA)>

#### Documento XML:

<?xml version="1.0" encoding="UTF-8"?> <!DOCTYPE libro SYSTEM "libro.dtd"> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro>

#### Validación con XSD (XML Schema Definition)

El XSD es un esquema más avanzado que permite definir tipos de datos, restricciones y relaciones complejas entre elementos.

#### Archivo XSD externo (libro.xsd):

<?xml version="1.0" encoding="UTF-8"?> <xs:schema xmlns:xs="[http://www.w3.org/2001/XMLSche-](http://www.w3.org/2001/XMLSche-) ma">

<xs:element name="libro"> <xs:complexType> <xs:sequence> <xs:element name="titulo" type="xs:string"/> <xs:element name="autor" type="xs:string"/> </xs:sequence> </xs:complexType> </xs:element> </xs:schema>

#### Documento XML vinculado:

<?xml version="1.0" encoding="UTF-8"?> <libro xmlns:xsi="[http://www.w3.org/2001/XMLSche-](http://www.w3.org/2001/XMLSche-) ma-instance" xsi:noNamespaceSchemaLocation="libro.xsd"> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro>

#### Herramientas para validar XML

- **Editores de texto:** – Visual Studio Code (extensiones como XML Tools) – Notepad++ (con plugins XML Tools)
- **Herramientas en línea:** ##### – W3C Validator

#### – FreeFormatter

- **Librerías en lenguajes de programación:** – **Java: JAXP, JAXB** – **Python: xmlschema, lxml**

#### – C#: System.Xml.Schema

#### Ventajas de la validación XML

- **Integridad de los datos: asegura que los datos cumplen con las** reglas definidas.
- **Interoperabilidad: facilita el intercambio de datos entre sistemas** al garantizar formatos estandarizados.

- **Facilidad de depuración: detecta errores estructurales y de con-** tenido en etapas tempranas.
- **Escalabilidad: permite manejar estructuras de datos complejas y** relaciones jerárquicas.
#### Ejemplo práctico de validación

#### Esquema XSD (catalogo.xsd):

<?xml version="1.0" encoding="UTF-8"?> <xs:schema xmlns:xs="[http://www.w3.org/2001/XMLSche-](http://www.w3.org/2001/XMLSche-) ma"> <xs:element name="catalogo"> <xs:complexType> <xs:sequence> <xs:element name="producto" maxOccurs="unbounded"> <xs:complexType> <xs:sequence> <xs:element name="nombre" type="xs:string"/> <xs:element name="precio" type="xs:decimal"/> </xs:sequence> <xs:attribute name="id" type="xs:string" use="required"/> </xs:complexType> </xs:element> </xs:sequence> </xs:complexType> </xs:element> </xs:schema>

#### Documento XML vinculado:

<?xml version="1.0" encoding="UTF-8"?> <catalogo xmlns:xsi="[http://www.w3.org/2001/XMLSche-](http://www.w3.org/2001/XMLSche-) ma-instance" xsi:noNamespaceSchemaLocation="catalogo. xsd"> <producto id="101"> <nombre>Portátil</nombre> <precio>799.99</precio> </producto> <producto id="102"> <nombre>Smartphone</nombre> <precio>999.99</precio> </producto> </catalogo>

La validación XML es un proceso esencial para garantizar la calidad y consistencia de los datos. Al utilizar herramientas como DTD o XSD, los desarrolladores pueden definir reglas claras que permitan estructurar los documentos XML y facilitar su integración en aplicaciones complejas, aumentando la fiabilidad en el intercambio de datos.

### 5.5. Conversión y adaptación de documentos XML

La conversión y adaptación de documentos XML consiste en transformar su estructura y contenido para cumplir con diferentes propósitos, como integrarse con otros sistemas, generar formatos alternativos o adecuarse a requisitos específicos. Este proceso es esencial para garantizar la interoperabilidad entre aplicaciones y plataformas.

#### ¿Qué implica la conversión y adaptación de XML?

Conversión: transformar un documento XML a otros formatos, como HTML, JSON, CSV o PDF para su presentación o intercambio de datos.

Adaptación: modificar la estructura o contenido del documento XML para ajustarlo a un nuevo esquema, sistema o conjunto de reglas.

#### Métodos para la conversión y adaptación

#### Uso de XSLT (Extensible Stylesheet Language Transformations)

XSLT es un lenguaje diseñado específicamente para transformar documentos XML en otros formatos, como HTML, texto plano o incluso otro XML.

#### Ejemplo de conversión de XML a HTML:

- **Documento XML:** <?xml version="1.0" encoding="UTF-8"?> <biblioteca> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro> </biblioteca>

`# Tema 6. Gestión y almacenamiento de información en XML

Los sistemas de almacenamiento de información XML permiten gestionar documentos estructurados de manera eficiente, utilizando diferentes enfoques según las necesidades. Los documentos XML pueden guardarse como archivos en el sistema, lo que resulta sencillo pero poco escalable. Otra opción es almacenarlos en bases de datos relacionales, ya sea como texto en una columna XML o descomponiendo su estructura en tablas. Sin embargo, para documentos más complejos, las bases de datos nativas XML, como BaseX o eXist-db, ofrecen mejores herramientas de consulta mediante XPath y XQuery. También pueden almacenarse en bases de datos NoSQL, convirtiéndolos a formatos como JSON.

Las bases de datos relacionales han integrado compatibilidad con XML, permitiendo almacenar y consultar documentos dentro de su estructura tabular. SQL Server, MySQL y Oracle ofrecen funciones avanzadas para manipular XML con XPath y XQuery. Sin embargo, este método puede ser menos eficiente que el uso de bases nativas.

Para la búsqueda de información en documentos XML, se utilizan lenguajes como XPath y XQuery, que permiten navegar por la jerarquía del documento y extraer datos de manera flexible. Estas herramientas hacen que XML sea una solución versátil para almacenar y consultar información estructurada en múltiples entornos.

### 6.1. Sistemas de almacenamiento de información XML

Los documentos XML se utilizan comúnmente para estructurar y transportar datos, pero su almacenamiento requiere sistemas especializados que garanticen su organización, consulta y manejo eficiente. Los sistemas de **almacenamiento de información XML son herramientas y tecnologías** diseñadas para guardar y gestionar documentos XML de manera óptima.

#### Tipos de sistemas de almacenamiento para XML

#### Almacenamiento como archivo

- **Descripción: los documentos XML se almacenan como archivos** en el sistema de archivos.
- **Ventajas:**
#### – Fácil de implementar y manejar.

  - Ideal para documentos XML pequeños o de uso ocasional.

- **Limitaciones:** – Difícil de escalar con grandes volúmenes de datos.
#### – Consultas complejas requieren procesamiento adicional.

**Ejemplo:**

Un archivo biblioteca.xml almacenado en el sistema de archivos:

<biblioteca> <libro> <titulo>Lenguajes de Marcas</titulo> <autor>Pablo García</autor> </libro> </biblioteca>

#### Almacenamiento en bases de datos relacionales

- **Descripción: las bases de datos relacionales almacenan documen-** tos XML en tablas, ya sea como texto completo o descompuestos en columnas.
- **Métodos comunes:** – **Columna XML: el documento XML se almacena como una ca-** dena de texto. – **Mapeo relacional: los elementos XML se descomponen en ta-** blas y columnas.
- **Ventajas:** – Compatibilidad con bases de datos existentes.
#### – Uso de SQL para consultas.

- **Limitaciones:** – El mapeo relacional puede ser complejo para XML con estructuras anidadas.
#### Ejemplo de almacenamiento en SQL Server:

CREATE TABLE Biblioteca ( ID INT PRIMARY KEY, Datos XML );

INSERT INTO Biblioteca (ID, Datos) VALUES (1, '<libro><titulo>Lenguajes de Marcas</titulo><autor>Pablo García</autor></libro>');

#### Bases de datos nativas XML

- **Descripción: estas bases de datos están diseñadas específicamente** para almacenar y gestionar documentos XML en su formato nativo.
- **Ejemplos:** – **BaseX: base de datos ligera y eficiente para XML.** – **eXist-db: soporta consultas avanzadas con XQuery.** – **MarkLogic: orientada a la gestión de grandes volúmenes de** datos XML.
- **Ventajas:**
#### – Manejo directo del formato XML.

  - Soporte para consultas específicas como XPath y XQuery.

  - Ideal para estructuras XML complejas y jerárquicas.

- **Limitaciones:**
#### – Requiere infraestructura especializada.

  - Menos común que las bases de datos relacionales.

#### Almacenamiento en bases de datos NoSQL

- **Descripción: bases de datos orientadas a documentos, como Mon-** goDB o CouchDB, pueden almacenar XML convirtiéndolo a JSON.
- **Ventajas:**
#### – Escalabilidad y flexibilidad.

#### – Compatibilidad con aplicaciones modernas.

- **Limitaciones:** – Requiere conversión de XML a JSON para almacenamiento.

#### Ejemplo: obtener todos los títulos de un documento XML.

/biblioteca/libro/titulo

for $libro in /biblioteca/libro return $libro/titulo

Uso de SQL para extraer datos XML almacenados.

#### Factores a considerar al elegir un sistema de almacenamiento XML

#### Volumen de datos

- Archivos individuales funcionan para volúmenes pequeños.
- Bases de datos nativas o NoSQL son mejores para grandes volúmenes.
#### Frecuencia de consultas

- Consultas frecuentes o complejas requieren bases de datos nativas o relacionales.
#### Estructura del XML

- Documentos muy anidados son más fáciles de manejar en bases de datos nativas.

**Escalabilidad**

- Bases de datos NoSQL o nativas ofrecen mayor escalabilidad que los archivos.
#### Ventajas de los sistemas de almacenamiento XML

- **Flexibilidad: permiten almacenar datos complejos y jerárquicos.**
- **Interoperabilidad: facilitan el intercambio de información entre** diferentes sistemas.
- **Consultas avanzadas: XPath, XQuery y SQL permiten extraer da-** tos de manera eficiente.
- **Compatibilidad con tecnologías modernas: bases de datos NoS-** QL y nativas son ideales para aplicaciones actuales.
#### Ejemplo práctico:

#### Almacenamiento en eXist-db

#### Archivo biblioteca.xml:

Los sistemas de almacenamiento de información XML ofrecen soluciones adaptadas a diferentes necesidades, desde archivos simples hasta bases de datos especializadas. Elegir el sistema adecuado depende del volumen de datos, la complejidad de las consultas y la escalabilidad requerida. Gracias a tecnologías como bases de datos nativas XML y lenguajes de consulta como XPath y XQuery, el manejo de documentos XML es eficiente y versátil en entornos modernos.

### 6.2. BBDD relacionales con XML

Las bases de datos relacionales (BBDD relacionales) son sistemas diseñados para almacenar y gestionar datos estructurados en tablas. Aunque estas bases de datos no están diseñadas específicamente para trabajar con XML, han integrado capacidades para almacenar, consultar y procesar documentos XML, facilitando su uso en entornos que combinan datos relacionales y jerárquicos.

**Métodos para trabajar con XML en bases de datos relacionales**

- **Almacenamiento como texto**: los documentos XML se guardan como cadenas en columnas de tipo TEXT o VARCHAR.
- **Columna de tipo XML**: algunas bases de datos, como SQL Server y DB2, tienen un tipo de dato específico para XML. Esto permite validar y consultar documentos XML directamente.
- **Descomposición de XML**: los datos del XML se descomponen en tablas relacionales, facilitando consultas SQL estándar.

**Ventajas del uso de XML en bases de datos relacionales**

- **Interoperabilidad**: permite almacenar datos jerárquicos junto con datos relacionales en un mismo sistema.
- **Flexibilidad**: soporta documentos XML de tamaños y estructuras variables.
- **Consultas avanzadas**: integración con lenguajes como XPath o XQuery para consultas específicas dentro de XML.
- **Validación**: en algunos sistemas, se pueden validar documentos XML con esquemas como XSD.

**Implementaciones comunes**

#### SQL Server

Tipo de dato XML: SQL Server incluye el tipo de dato XML para almacenar y manipular documentos XML.

#### Ejemplo de creación de tabla:

CREATE TABLE Biblioteca ( ID INT PRIMARY KEY, Documento XML );

#### Inserción de datos XML:

INSERT INTO Biblioteca (ID, Documento) VALUES (1, '<libro><titulo>Lenguajes de Marcas</titulo><autor>Pablo García</autor></libro>');

#### Consulta de datos XML:

SELECT Documento.value('(/libro/titulo)[1]', 'VAR- CHAR(MAX)') AS Titulo FROM Biblioteca WHERE ID = 1;

**MySQL**

En MySQL, los documentos XML suelen almacenarse como cadenas en columnas de tipo TEXT o LONGTEXT.

#### Ejemplo de creación de tabla:

CREATE TABLE Biblioteca ( ID INT PRIMARY KEY, Documento LONGTEXT );

**Oracle**

#### Uso de XPath

Navega por la estructura del XML para extraer elementos específicos.

/libro/titulo

#### Uso de XQuery

Permite realizar transformaciones y consultas más complejas.

#### Limitaciones del uso de XML en BBDD relacionales

**Conclusión**

El uso de XML en bases de datos relacionales combina lo mejor de ambos mundos: la organización tabular de las bases de datos y la flexibilidad jerárquica de XML. Aunque no siempre es la solución más eficiente, esta integración es valiosa para aplicaciones que requieren trabajar con ambos tipos de datos. Herramientas como SQL Server, MySQL y Oracle proporcionan un soporte robusto para manejar documentos XML dentro del ecosistema relacional.

### 6.3. Búsqueda de Información en Documentos XML

`# Tema 7. Sistemas de gestión empresarial

La inteligencia de negocio (Business Intelligence, BI) es un enfoque integral que combina estrategias, tecnologías y herramientas para transformar datos en información valiosa, facilitando la toma de decisiones empresariales a nivel estratégico, táctico y operativo. Este texto profundiza en el concepto de BI, comenzando por su definición y capacidad para integrar datos provenientes de diversas fuentes internas y externas, procesarlos mediante técnicas como ETL (extracción, transformación y carga), y visualizarlos en dashboards interactivos o informes detallados.

En este apartado destacamos los principales componentes de la inteligencia de negocio, como almacenes de datos optimizados para análisis, minería de datos y algoritmos de machine learning, además de herramientas populares como Microsoft Power BI, Tableau o Qlik Sense. Se subrayan sus beneficios clave, como la mejora en la toma de decisiones, la identificación de oportunidades, la optimización de procesos internos y la obtención de una ventaja competitiva.

Adicionalmente, se exploran aplicaciones prácticas de BI en sectores como finanzas, marketing, logística y recursos humanos, mostrando cómo estas soluciones permiten gestionar recursos, analizar tendencias y mejorar la eficiencia operativa. Ejemplos prácticos ilustran el uso de BI en casos específicos, como la optimización de inventarios en una empresa de retail, destacando el impacto positivo de estas herramientas en el rendimiento empresarial.

### 7.1. Inteligencia de negocio

La inteligencia de negocio (BI) es un conjunto de estrategias, procesos, tecnologías y herramientas diseñadas para recopilar, analizar y transformar datos en información significativa. Su objetivo principal es apoyar la toma de decisiones estratégicas, tácticas y operativas en las organizaciones

#### Definición de inteligencia de negocio

La inteligencia de negocio permite a las empresas:

- Recopilar datos de múltiples fuentes internas y externas.
- Procesar y analizar estos datos para obtener información relevante.
- Presentar esta información en formatos visuales, como dashboards e informes, que faciliten la comprensión.
#### Componentes de la inteligencia de negocio

- **Fuentes de datos:** – Datos internos: ERP, CRM, bases de datos empresariales. – Datos externos: redes sociales, tendencias de mercado, estadísticas públicas.
- **Procesos de extracción, transformación y carga (ETL):** – **Extracción: recopilación de datos desde múltiples fuentes.** – **Transformación: limpieza y formateo de datos para que sean** consistentes. – **Carga: almacenamiento de los datos en un almacén o base de** datos analítica.
- **Almacenes de datos (data warehouses): bases de datos optimi-** zadas para el análisis y la generación de informes.
- **Análisis de datos: técnicas estadísticas, minería de datos y algo-** ritmos de aprendizaje automático (machine learning).
- **Visualización: herramientas como Power BI, Tableau o Qlik Sense,** que convierten los datos analizados en gráficos, tablas y dashboards interactivos.

#### Beneficios de la inteligencia de negocio

- **Mejora en la toma de decisiones: permite decisiones informadas** basadas en datos objetivos.
- **Identificación de oportunidades: ayuda a descubrir patrones,** tendencias y áreas de mejora.
- **Eficiencia operativa: optimiza procesos internos mediante el** análisis de rendimiento.
- **Segmentación de clientes: identifica las necesidades y compor-** tamientos de los clientes para estrategias más efectivas.
- **Ventaja competitiva: facilita una respuesta más rápida y efectiva** ante cambios en el mercado.
#### Herramientas de inteligencia de negocio

#### Aplicaciones de la inteligencia de negocio

- **Marketing: evaluación de campañas, segmentación de clientes y** análisis de redes sociales.
- **Logística: optimización de cadenas de suministro y gestión de** inventarios.

#### Empresa de retail

### 7.2. Sistemas de gestión de recursos empresariales (ERP)

Los sistemas de gestión de recursos empresariales (ERP) son soluciones de software diseñadas para integrar y gestionar de manera centralizada los procesos y recursos de una organización. Su principal objetivo es mejorar la eficiencia operativa y proporcionar una visión integral del negocio, unificando áreas como finanzas, logística, recursos humanos, producción y ventas en un único sistema.

#### ¿Qué es un ERP?

Un ERP (Enterprise Resource Planning) es un conjunto de módulos interconectados que comparten una base de datos común. Esto permite que los datos se actualicen en tiempo real y sean accesibles para todos los departamentos de la organización.

**Ejemplo:**

Una empresa puede integrar el inventario, las ventas y la contabilidad en un mismo ERP para que, al registrarse una venta, el sistema reduzca automáticamente las existencias y actualice los ingresos en los estados financieros.

#### Características principales de un ERP

- **Integración: centraliza la información de diferentes departamentos** en un único sistema.
- **Automatización: simplifica tareas repetitivas, como la facturación,** el control de inventarios y la generación de informes.
- **Acceso en tiempo real: proporciona datos actualizados para** mejorar la toma de decisiones.
- **Escalabilidad: los ERP modernos pueden adaptarse al crecimiento** de la organización.
- **Modularidad: se compone de módulos independientes que pueden** implementarse según las necesidades de la empresa.

#### Componentes y módulos de un ERP

Un ERP se organiza en módulos, cada uno enfocado en un área específica del negocio. Los más comunes son:

- **Finanzas y contabilidad: gestión de presupuestos, cuentas por** pagar y por cobrar, y generación de informes financieros.
- **Gestión de inventarios: control de existencias, pedidos y optimi-** zación de la cadena de suministro.
- **Recursos humanos: nóminas, reclutamiento, evaluación de** desempeño y capacitación.
- **Gestión de ventas: registro de pedidos, facturación y análisis de** ventas.
- **Producción: planificación de la producción, control de calidad y** seguimiento de procesos.
- **Gestión de clientes (CRM): administración de relaciones con** clientes para mejorar el servicio y aumentar las ventas.
- **Compras: gestión de proveedores, órdenes de compra y contratos.**
#### Ventajas de un ERP

- **Mejora en la eficiencia: automatiza procesos y reduce el tiempo** dedicado a tareas manuales.
- **Integración de datos: proporciona una visión global y consistente** de la empresa.
- **Toma de decisiones basada en datos: ofrece informes y análisis** en tiempo real para apoyar decisiones estratégicas.
- **Reducción de costes: optimiza recursos y minimiza errores en los** procesos.
- **Cumplimiento normativo: ayuda a cumplir con regulaciones lo-** cales e internacionales mediante módulos especializados.
#### Desventajas de un ERP

- **Coste elevado: la implementación y mantenimiento de un ERP** puede ser caro, especialmente para pequeñas empresas.
- **Complejidad: requiere tiempo y esfuerzo para adaptarse a los** procesos de la organización.

- **Dependencia del proveedor: las actualizaciones y soporte técni-** co pueden depender completamente del proveedor.
- **Resistencia al cambio: los empleados pueden enfrentar dificulta-** des para adaptarse a nuevos sistemas.
#### Principales soluciones ERP en el mercado

- **SAP ERP: líder en el mercado, con funcionalidades avanzadas para** grandes empresas.
- **Oracle NetSuite: ERP basado en la nube, ideal para negocios en** crecimiento.
- **Microsoft Dynamics 365: solución flexible que combina ERP y** CRM en una única plataforma.
- **Odoo: ERP de código abierto, modular y personalizable.**
- **Sage: focalizado en pequeñas y medianas empresas, con módulos** específicos para finanzas y nóminas.
- **Infor ERP: enfocado en industrias específicas como manufactura** y distribución.
#### Ejemplo práctico del uso de un ERP:

- **Escenario:** Una empresa de manufactura quiere mejorar su control de inventarios y procesos de producción.
- **Problema:**
#### – Inventarios desactualizados.

  - Retrasos en la producción por falta de materiales.

- **Solución con un ERP:** – Módulo de inventarios: actualiza automáticamente las existencias tras cada venta o recepción de materiales. – Módulo de producción: planifica las órdenes de trabajo y verifica la disponibilidad de materiales antes de comenzar la producción.
- **Resultado:** – Reducción de retrasos en la producción. – Disminución de costes al optimizar los niveles de inventario.

Los sistemas ERP son herramientas fundamentales para la gestión eficiente de los recursos empresariales. Su capacidad para integrar y automatizar procesos en diferentes áreas mejora la productividad y la competitividad de las organizaciones. Sin embargo, su implementación requiere una planificación cuidadosa para maximizar sus beneficios y minimizar los riesgos asociados.

### 7.3. Sistemas de gestión de relaciones con los clientes (CRM)

Los sistemas de gestión de relaciones con los clientes (CRM, por sus siglas en inglés) son herramientas diseñadas para centralizar y optimizar las interacciones entre una empresa y sus clientes. Su objetivo principal es mejorar la experiencia del cliente, aumentar la retención y fomentar relaciones a largo plazo, lo que impacta directamente en el crecimiento del negocio.

**¿Qué es un CRM?**

Un CRM (Customer Relationship Management) es un software que permite a las empresas:

- Gestionar información de clientes, como datos de contacto, historial de compras e interacciones previas.
- Automatizar procesos relacionados con las ventas, el marketing y el servicio al cliente.
- Analizar datos para identificar oportunidades de negocio y mejorar estrategias.

**Ejemplo:**

Un CRM puede registrar automáticamente las interacciones de un cliente con la empresa (llamadas, correos electrónicos, compras) y generar alertas para que un vendedor le ofrezca productos adicionales basados en sus preferencias.

#### Características principales de un CRM

- **Gestión de contactos: almacena información detallada de los** clientes en un lugar centralizado.
- **Automatización de ventas: gestiona el ciclo de ventas, desde la** generación de prospectos hasta el cierre de oportunidades.
- **Automatización de marketing: permite crear campañas per-** sonalizadas, enviar correos masivos y realizar seguimiento a las respuestas.
- **Gestión de servicios: administra solicitudes, consultas y proble-** mas de los clientes para mejorar el soporte.
- **Análisis y reportes: proporciona datos en tiempo real sobre el** rendimiento de las ventas, la eficacia del marketing y la satisfacción del cliente.
- **Accesibilidad: la mayoría de los CRM modernos están en la nube,** lo que facilita el acceso desde cualquier lugar.
#### Tipos de CRM

- **CRM operativo: automatiza procesos relacionados con las ventas,** el marketing y el servicio al cliente.
#### Ejemplos: Salesforce, HubSpot.

- **CRM analítico: se centra en el análisis de datos para comprender** mejor el comportamiento del cliente y predecir tendencias.
#### Ejemplo: Zoho CRM.

- **CRM colaborativo: facilita la comunicación entre los departa-** mentos internos de una empresa para ofrecer un servicio más coordinado.
#### Ejemplo: Microsoft Dynamics 365.

#### Beneficios de implementar un CRM

- **Mejora en la atención al cliente: proporciona un historial completo** de interacciones, permitiendo respuestas personalizadas y rápidas.
- **Incremento en las ventas: identifica oportunidades de ventas** cruzadas y upselling, mejorando la conversión de prospectos.
- **Fidelización de clientes: ayuda a fortalecer las relaciones me-** diante un seguimiento constante y personalizado.

- **Optimización del tiempo: automatiza tareas repetitivas, permi-** tiendo al equipo enfocarse en actividades estratégicas.
- **Decisiones basadas en datos: ofrece métricas y análisis que apoyan** la planificación y ejecución de estrategias.
#### Principales soluciones CRM en el mercado

- **Salesforce: líder en CRM, ofrece herramientas avanzadas para** ventas, marketing y análisis.
- **HubSpot CRM: gratuito y fácil de usar, ideal para pequeñas y** medianas empresas.
- **Zoho CRM: solución asequible con un enfoque en la automatización** de procesos.
- **Microsoft Dynamics 365: integra CRM con ERP, ofreciendo una** solución completa para grandes organizaciones.
- **Pipedrive: centrado en la gestión del pipeline de ventas, ideal** para equipos comerciales.
- **SugarCRM: personalizable y diseñado para empresas con necesi-** dades específicas.
#### Ejemplo práctico del uso de un CRM

- **Escenario:** Una empresa de ecommerce quiere mejorar la experiencia de compra de sus clientes.
- **Problema:** – Los clientes reciben correos genéricos sin personalización. – Los representantes de ventas no tienen acceso al historial de interacciones.
- **Solución CRM:** – **Automatización de marketing: segmenta clientes por hábitos de compra y envía correos** personalizados con recomendaciones. – **Gestión de contactos: proporciona a los vendedores un historial completo de las com-** pras y consultas de cada cliente.
- **Resultado:** – Aumento del 20% en la tasa de conversión. – Mejora en la satisfacción del cliente gracias a un servicio más personalizado.

#### Desafíos al implementar un CRM

- **Coste: los CRM avanzados pueden ser costosos, especialmente** para pequeñas empresas.
- **Adaptación: requiere capacitación para que el equipo aprenda a** usar la herramienta de manera efectiva.
- **Integración: puede ser complicado integrar el CRM con otros** sistemas existentes.
- **Resistencia al cambio: los empleados pueden mostrar resistencia** a adoptar un nuevo sistema.
Un CRM es una herramienta indispensable para las empresas que desean mejorar su relación con los clientes, optimizar sus procesos de ventas y marketing, y tomar decisiones basadas en datos. Su implementación, aunque requiere planificación y recursos, genera beneficios significativos en términos de satisfacción del cliente, eficiencia operativa y crecimiento empresarial.

### 7.4. Instalación de un ERP

Odoo es un ERP modular y flexible que permite gestionar diferentes áreas de una empresa, como finanzas, ventas, inventarios y recursos humanos. Gracias a Docker, su instalación se simplifica, ya que los contenedores gestionan todas las dependencias y configuraciones necesarias.

#### Requisitos previos

1. **Docker y Docker Compose instalados: Docker debe estar ins-** talado en el sistema. Si no es así, pueden seguirse los pasos de instalación descritos en el apartado anterior.
#### – Verificar la instalación:

docker --version docker-compose --version

#### Acceso a internet: Docker necesita descargar las imágenes de

Odoo y PostgreSQL desde el Docker Hub.

#### Espacio en disco: aproximadamente 5 GB libres para las imágenes y datos.

2. **Descarga de imágenes necesarias:**
#### Odoo requiere dos contenedores principales:

#### – Odoo: la aplicación principal.

  - **PostgreSQL: la base de datos utilizada por Odoo.**

Las imágenes pueden descargarse directamente con los siguientes comandos:

docker pull odoo:latest docker pull postgres:latest

3. **Configuración con Docker Compose:**
#### Docker Compose facilita la creación y gestión de múltiples contenedores con un solo archivo de configuración (docker-compose. yml).

#### Crear un directorio para Odoo:

mkdir odoo_docker && cd odoo_docker

#### Crear el archivo docker-compose.yml: puede emplearse el editor

de texto favorito para crear el archivo.

#### Contenido del archivo:

version: '3.1'

services: db: image: postgres:latest container_name: odoo_db environment: POSTGRES_USER: odoo POSTGRES_PASSWORD: odoo POSTGRES_DB: odoo volumes:

- odoo-db-data:/var/lib/postgresql/data networks:
- odoo-net odoo: image: odoo:latest container_name: odoo_app depends_on:
- db ports:
- "8069:8069" environment:

HOST: db USER: odoo PASSWORD: odoo volumes:

- odoo-app-data:/var/lib/odoo
- ./config:/etc/odoo networks:
- odoo-net volumes: odoo-db-data: odoo-app-data: networks: odoo-net:
#### Explicación de la configuración:

  - **db: definir el servicio de PostgreSQL.**

- Crear un usuario, contraseña y base de datos para Odoo.
#### – odoo: configurar la aplicación Odoo.

- Exposición del puerto 8069 para acceder a la interfaz web.
  - **Volúmenes: garantizan que los datos sean persistentes incluso** si los contenedores se eliminan.

  - **Red: los servicios db y odoo están conectados a una red interna** para comunicarse.

4. **Inicio del ERP con Docker Compose:**
#### Iniciar los servicios: ejecutar el siguiente comando en el directorio donde se encuentra el archivo docker-compose.yml:

docker-compose up -d

#### Verificar los contenedores en ejecución:

docker ps

Deberían verse los contenedores odoo_app y odoo_db en ejecución.

#### Acceder a Odoo: debe abrirse un navegador web y acceder a:

[http://localhost:8069](http://localhost:8069)

Desde aquí puede configurarse Odoo, crear una base de datos y comenzar a explorar los módulos.

5. **Comandos útiles:**
#### Detener los contenedores:

docker-compose down

#### Ver logs de los contenedores:

docker-compose logs

#### Reiniciar los servicios:

docker-compose restart

#### Eliminar todos los contenedores y datos:

docker-compose down -v

6. **Ventajas de usar Docker para instalar Odoo:**
- **Rapidez: la instalación y configuración se completan en pocos pasos.**
- **Portabilidad: el sistema puede ejecutarse en cualquier máquina** con Docker instalado.
- **Aislamiento: Odoo y PostgreSQL se ejecutan en contenedores se-** parados, evitando conflictos con otras aplicaciones.
- **Facilidad de mantenimiento: actualizar Odoo o PostgreSQL implica** simplemente reemplazar las imágenes y reiniciar los contenedores.
Instalar Odoo con Docker es un enfoque eficiente, rápido y escalable para implementar este ERP en cualquier entorno. Con Docker Compose, la gestión de múltiples contenedores se simplifica, lo que permite a las empresas centrarse en la configuración y uso de Odoo sin preocuparse por problemas de dependencias o instalación manual. Esto hace que Docker sea una solución ideal para entornos de desarrollo, pruebas y producción.

### 8.3. Probemos otro lenguaje: Typescript

#### TypeScript es un lenguaje de programación de código abierto desarrollado por Microsoft. Es una extensión de JavaScript que añade tipado estático opcional y herramientas avanzadas que mejoran la robustez y escalabilidad de las aplicaciones.

En este taller exploraremos los conceptos básicos de TypeScript y su aplicación práctica mediante ejercicios sencillos.

#### ¿Qué es TypeScript?

TypeScript es un superconjunto de JavaScript, lo que significa que todo el código JavaScript válido también es válido en TypeScript. Sin embargo, TypeScript añade características como:

- **Tipado estático: declara tipos para variables, funciones y objetos.**
- **Interfaces y clases avanzadas: facilita la programación orientada** a objetos.
- **Herramientas de desarrollo: detección de errores en tiempo de** desarrollo gracias al compilador TypeScript.
El código TypeScript se compila en JavaScript para ser ejecutado en navegadores o entornos como Node.js.

#### Instalación y configuración **Requisitos previos**

Node.js instalado en el sistema. Puede descargarse en Node.js.

#### Instalar TypeScript

#### Abrir la terminal y ejecutar:

npm install -g typescript

#### Verificar la instalación:

tsc --version

#### Configurar TypeScript

Crear un directorio para el proyecto:

mkdir taller-typescript && cd taller-typescript

Inicializar un proyecto de TypeScript:

tsc --init

Esto generará un archivo tsconfig.json que contiene la configuración del compilador.

// Declaración de tipos

#### Compilar y ejecutar:

Compilar el archivo:

tsc main.ts

Esto generará un archivo main.js.

Ejecutar el archivo JavaScript:

node main.js

### SEO y SEM

El SEO y el SEM son estrategias fundamentales en el marketing digital que buscan mejorar la visibilidad de un sitio web en los motores de búsqueda. Aunque ambas comparten el objetivo de atraer tráfico, utilizan métodos diferentes para lograrlo.

#### ¿Qué es el SEO? (Search Engine Optimization)

El SEO se refiere a las técnicas y estrategias destinadas a mejorar el posicionamiento orgánico de un sitio web en los resultados de búsqueda. Es un proceso que no implica pagos directos por cada clic, sino que se centra en optimizar el sitio para que los motores de búsqueda lo consideren relevante y útil.

#### Componentes principales del SEO

- **SEO On-Page: optimización interna del sitio web.** – Uso adecuado de palabras clave. – Etiquetas HTML bien estructuradas (<title>, <meta description>, <h1>). – Contenido relevante, único y actualizado. – Mejora de la experiencia del usuario (velocidad de carga, diseño responsive, accesibilidad).
- **SEO Off-Page: factores externos que influyen en la autoridad del sitio.** – Construcción de enlaces (backlinks). – Presencia en redes sociales. – Menciones en otros sitios web.
- **SEO Técnico: aspectos técnicos que afectan el rastreo e indexación del sitio.** – Creación de un archivo sitemap.xml y un archivo robots.txt. – Optimización de la velocidad de carga. – Uso de datos estructurados (schema.org).
#### Ventajas del SEO

- Genera tráfico orgánico de calidad sin coste por clic.
- Mejora la experiencia del usuario.
- Ofrece resultados sostenibles a largo plazo.

#### Desventajas del SEO

Los resultados pueden tardar en aparecer.

Requiere un conocimiento técnico y constante actualización.

#### ¿Qué es el SEM? (Search Engine Marketing)

El SEM es una estrategia de marketing digital que utiliza campañas pagadas para aparecer en los resultados de búsqueda. Se basa principalmente en plataformas como Google Ads para posicionar anuncios patrocinados.

#### Componentes principales del SEM

- **Publicidad de búsqueda (Search Ads):** – Anuncios que aparecen en la parte superior o inferior de los resultados de búsqueda. – Se configuran utilizando palabras clave relevantes para el negocio.
- **Pago por clic (PPC):** – El anunciante paga una cantidad cada vez que un usuario hace clic en su anuncio. – **Ejemplo: "Cómpralo ahora", "Descúbrelo aquí".**
#### Campañas segmentadas

  - Permite seleccionar la audiencia objetivo en función de la ubicación, idioma, dispositivo, intereses, etc.

  - **Ejemplo: Mostrar un anuncio solo a usuarios en España interesados en tecnología.**

#### Ventajas del SEM

  - Resultados inmediatos y mayor visibilidad desde el primer día.

  - Control sobre el presupuesto y el alcance de las campañas.

  - Métricas detalladas que permiten medir el rendimiento (CTR, conversiones).

#### Desventajas del SEM

  - Depende de la inversión económica.

  - El tráfico disminuye cuando se detiene la campaña.

#### Diferencias clave entre SEO y SEM

|Aspecto|SEO|SEM|
|---|---|---|
|Costo|Gratuito (tráfico orgánico)|De pago (tráfico patrocinado)|
|Tiempo de resultados|Largo plazo|Corto plazo (resultados inmediatos)|
|Visibilidad|Limitada al posicionamiento orgánico|Garantizada mientras se invierta|
|Sostenibilidad|Resultados duraderos|Depende de la inversión continua|
|Estrategia|Optimización técnica y contenido|Publicidad y segmentación de campañas|

#### Conclusión: ¿SEO o SEM?

- **SEO es ideal para quienes buscan resultados sostenibles y orgánicos a largo plazo.**
- **SEM es perfecto para generar tráfico rápidamente, especialmente en campañas específicas** o lanzamientos.
Ambas estrategias pueden complementarse. Por ejemplo, utilizar SEM para atraer tráfico inmediato mientras se desarrolla un SEO sólido para posicionamiento orgánico a largo plazo. Juntas, maximizan la visibilidad y el éxito de un sitio web.`

### Introducción a Docker

Docker es una plataforma de virtualización ligera que permite desarrollar, empaquetar y ejecutar aplicaciones en contenedores. Los contenedores son entornos independientes y portátiles que incluyen todo lo necesario para que una aplicación funcione, como el código, las librerías, las configuraciones y las dependencias.

Docker simplifica el despliegue de aplicaciones, ya que garantiza que funcionen de manera consistente en cualquier sistema que tenga Docker instalado.

#### Conceptos básicos de Docker

- **Imagen (Image): es una plantilla inmutable que contiene todo lo necesario para ejecutar una** aplicación, incluyendo el sistema operativo, las dependencias y el código.
- **Contenedor (Container): es una instancia en ejecución de una imagen. Cada contenedor es inde-** pendiente y aislado, pero puede comunicarse con otros contenedores si se configura.
- **Dockerfile: es un archivo de texto que contiene instrucciones para crear una imagen de Docker.**
- **Docker Hub: es un repositorio en línea donde se almacenan imágenes preconfiguradas que se** pueden descargar y usar.
- **Volúmenes: son áreas de almacenamiento persistente que los contenedores pueden usar para** guardar datos.
#### Ventajas de Docker

- **Portabilidad: las aplicaciones en contenedores funcionan de manera idéntica en cualquier siste-** ma que soporte Docker.
- **Aislamiento: cada contenedor está aislado del sistema anfitrión y de otros contenedores, lo que** evita conflictos entre aplicaciones.
- **Rapidez: los contenedores se inician en segundos, ya que comparten el kernel del sistema opera-** tivo en lugar de virtualizarlo.
- **Escalabilidad: Docker permite escalar aplicaciones fácilmente mediante la creación de múltiples** contenedores.
- **Facilidad de despliegue: con Docker, se puede replicar fácilmente un entorno de desarrollo, prue-** bas o producción.

#### Instalación básica de Docker

Docker se puede instalar en los sistemas operativos más comunes, como Linux, Windows y macOS. A continuación se describe el proceso básico:

**Linux**

1. Actualizar los paquetes del sistema: sudo apt update && sudo apt upgrade
2. Instalar Docker: sudo apt install docker.io
3. Verificar la instalación: docker --version
#### Windows y macOS

1. Descargar Docker Desktop desde Docker. [https://www.docker.com/](https://www.docker.com/)
2. Seguir al asistente de instalación.
#### Comandos básicos de Docker

- **Listar imágenes locales:** docker images
- **Descargar una imagen:** docker pull <nombre_imagen>
- **Ejecutar un contenedor:** docker run <nombre_imagen>
- **Listar contenedores en ejecución:** docker ps
- **Detener un contenedor:** docker stop <id_contenedor>

- **Eliminar un contenedor:** docker rm <id_contenedor>
- **Eliminar una imagen:** docker rmi <nombre_imagen>
#### ¿Por qué usar Docker para instalar Odoo?

Docker facilita la instalación y configuración de aplicaciones como Odoo, un ERP que requiere múltiples servicios (base de datos, backend, etc.). Con Docker puedes usar contenedores preconfigurados para desplegar Odoo rápidamente sin preocuparte por dependencias o configuraciones complejas. Además, permite

- Aislar la instalación de Odoo del sistema principal.
- Escalar la aplicación fácilmente.
- Realizar pruebas o actualizaciones sin riesgo de afectar el entorno de producción.`

`# 1. Uso de técnicas de programación segura

### 1.1. Prácticas de programación segura

A la hora de desarrollar programas, es necesario tener presente que un código limpio aportará seguridad a la aplicación.

#### Para ello es preciso:

- Estar siempre informado de los diferentes tipos de vulnerabilidades, con lo cual es necesario estar al día en ciberseguridad.
- Explorar software libre para conocer cómo se trabaja la seguridad en distintas aplicaciones.
Normalmente, toda aplicación recibirá información por parte del usuario, por lo que es importante el tratamiento de la misma. Los datos, al ser una parte muy sensible, es lo que más se suele atacar.

Es necesario verificar siempre que los datos introducidos son válidos, tanto los parámetros, como la información, como los ficheros que se utilizan.

Cuando se trabaja con URL páginas web, hay que tener presente la seguridad y, por ello, comprobar si la URL es fiable o no. Los datos de las webs pueden ser alterados por un usuario, tanto su contenido como la configuración.

En muchas ocasiones, los propios navegadores web avisan de que no se debe confiar en cookies de terceros, ya que estas también pueden ser modificadas.

Otro de los puntos clave en la programación segura es la reutilización de código, una práctica común y muy aconsejada, pero siempre teniendo en cuenta que ese código ha sido revisado y no cuenta con problemas de seguridad.

También se considera práctica de programación segura eliminar el código obsoleto para que no interceda con el código bueno, ya que, en las revisiones posteriores, podría llevar a confusión. Por último, se considera fundamental utilizar herramientas de software para detectar fallos en el código.

En resumen, durante el desarrollo de un producto software, se deben tener en cuenta los siguientes aspectos:

- Los usuarios son los mismos que intentarán vulnerar la aplicación.
- Los archivos que se utilicen en la aplicación deben ser de solo lectura, para evitar que un usuario los modifique.
- Toda información sensible guardada en la base de datos, o que se transmita por la red, debe ir siempre cifrada.
- Comprobar que todas las llamadas al sistema se han realizado con éxito y detener la aplicación si no ha sido así.
- Utilizar las rutas absolutas de los ficheros que se necesiten.
- No abrir nunca terminales desde una aplicación, ni otro software que no sea fiable.
### 1.2. Criptografía de clave pública y clave privada

La criptografía es el conjunto de técnicas que cifran información, con el objetivo de que un usuario no sea capaz de entender el contenido, y, por lo tanto, conseguir confidencialidad en el mensaje.

Para conseguir esta confidencialidad, es necesario transformar el mensaje mediante un algoritmo matemático. La criptología no solo se encarga de cifrar el mensaje, sino también de descifrarlo para que el receptor sea capaz de entenderlo.

Antes de conocer los distintos algoritmos que existen, es necesario conocer algunos conceptos importantes:

- Texto legible: es el mensaje original.
- Texto cifrado: es el resultado de aplicar uno de los siguientes algoritmos sobre un texto legible.
Existen diferentes tipos de algoritmos:

- **Cifrado César**: cifrado en el que se realiza una sustitución de cada letra por otra. El desplazamiento será el mismo para todas las letras del mensaje. Es un cifrado muy simple, pero bastante vulnerable. Los atacantes pueden conocer el mensaje mediante estadísticas. Para más información: [https://es.wikipedia.org/wiki/Cifrado_César](https://es.wikipedia.org/wiki/Cifrado_C%C3%A9sar)

**Funciones Hash o funciones de una sola vía**

Una función hash es una función que, dada cualquier cadena de caracteres, los convierte en otra cadena de longitud fija.

Algoritmos de función Hash o funciones de una sola vía:

- MD5: genera resúmenes de 128 bits, es decir, de 32 símbolos hexadecimales. Se suele utilizar para proteger al usuario de troyanos o de cualquier otro software malicioso. Normalmente, cuando se descarga un software, se utiliza una aplicación externa que, mediante este algoritmo, genera un hash del instalador. Si coincide con el que ofrece el propio desarrollador, este no habrá sido alterado.

- SHA-1: genera resúmenes de 160 bits, es decir, de 40 símbolos hexadecimales. Desde hace algunos años no se considera un algoritmo seguro, aunque se ha actualizado a versiones posteriores, como es SHA-2, con diferentes longitudes en los resúmenes.

- Algoritmos de clave secreta o de criptografía simétrica

En este tipo de algoritmos, tanto el emisor como el receptor comparten una única clave. El mensaje se cifra y se descifra con esa única clave.

- DES: utiliza una clave de 56 bits, por lo que no se considera seguro. Cifra bloques de datos de 64 bits con la clave de 56, y después de varias iteraciones, muestra 64 bits de salida.

- **Triple DES**: el algoritmo es el mismo que DES, pero, debido a la necesidad de aumentar su seguridad, se aumentó la clave a 112 bits, aunque sigue cifrando bloques de 64 bits.

- **AES**: al igual que DES y Triple DES es un algoritmo cifrador de bloques. En este caso, bloques de 128 bits. La diferencia se encuentra en el tamaño de la clave, puede ser de 128, 192 y 256 bits.

- Algoritmos de clave pública o de criptografía asimétrica
En este tipo de algoritmos se generan dos claves, denominadas clave pública y clave privada. El receptor genera estas claves y muestra la clave pública al emisor. El emisor utiliza esta clave para cifrar el mensaje y, posteriormente, el receptor utilizará la clave privada para desencriptarlo.

- **RSA**: la seguridad de este algoritmo radica en el problema de la factorización de números enteros. Tanto la clave pública como la clave privada se componen de un par de números.

- Pública (n, e).
- Privada (n, d).

Estos números son hallados mediante operaciones a partir de dos números primos, escogidos de forma aleatoria. Hay que tener en cuenta que es imposible conocer d, aunque conozcamos n y e. Este algoritmo es la base de la firma digital.

### 1.3. Principales aplicaciones de la criptografía

- Seguridad en las comunicaciones: es la principal aplicación, puesto que se encarga de que los canales en Internet sean seguros.
- Identificación y autenticación en recursos y sistemas: mediante la criptografía es posible validar el acceso de los usuarios a la firma digital, tanto si se realiza a través de contraseña, o mediante una técnica más segura. La firma digital es el mecanismo mediante el cual el receptor es capaz de identificar al emisor. Asegura autenticación de origen y no repudio, además de integridad del mensaje.
La comprobación de la integración del mensaje, al igual que el de la autenticación del origen, se realiza comprobando la igualdad entre el resumen que se consigue al descifrar el mensaje y el resumen de la firma digital.

- **Certificación**: un certificado digital es un documento que asocia los datos de identificación a una persona física, empresa o a un organismo, de manera que pueda identificarse en Internet. Este certificado es generado por una Autoridad Certificadora (AC), que también es la encargada de realizar la autenticación al usuario.
- **Comercio electrónico**: mediante la criptografía es posible realizar operaciones sensibles por Internet, con la seguridad de que los datos no serán interceptados por terceros.

### 1.4. Política de seguridad

Una política de seguridad es un conjunto de normas que se utilizan para proteger un sistema. Para que un sistema sea seguro deben cumplirse todas estas características, teniendo en cuenta que tanto el no repudio como la confidencialidad dependen de la autenticidad para poder cumplirse.

- **Integridad de los datos**: se asegura de que no hayan sido modificados por terceros, es decir, que se recibe el mensaje tal y como se envió.
- **Disponibilidad**: característica por la cual los datos se encuentran a disposición de quienes deban acceder a ellos.
- **Confidencialidad**: los mensajes solo podrán ser leídos por aquellas personas que han sido autorizadas para ello. De esta forma se garantiza la privacidad de los datos.
- **Autenticidad**: característica mediante la cual el receptor conoce la identidad del emisor.
- **No repudio**: el emisor no puede negar que ha enviado el mensaje, por lo que se evita que se culpe al canal de información de que la información no ha llegado.

El control de acceso se encarga de comprobar si una persona u otra entidad tiene permisos necesarios para acceder al recurso que solicita.

- Autorización: es la última parte del proceso. Si la autenticación ha resultado con éxito, el sistema ofrece la información requerida, o el acceso al recurso. Para acabar el ejemplo, sería el momento en el que el servidor muestra la bandeja de correo al usuario.
Se ha indicado anteriormente que en el proceso de autenticación el sistema debe verificar que el usuario es quien dice ser. Este proceso es necesario llevarlo a cabo mediante algún tipo de código con el cual únicamente pueda acceder este usuario.

#### Existen varias formas:

- Contraseña.
- Biometría: entre los que se engloban lectura de retina, huella dactilar, reconocimiento de voz, entre otros.
- Tarjetas de identificación: como puede ser el DNI electrónico.

SSH utiliza tanto cifrado asimétrico como simétrico. Mediante el primero, garantiza la autenticidad del cliente y del servidor, mientras que con el cifrado simétrico se garantiza la confidencialidad y la integridad de los mensajes.

SSL y TLS. El protocolo TLS (Transport Layer Security, seguridad de la capa de transporte) actúa en la capa de transporte, al mismo nivel que los sockets, y por debajo de HTTP. Suele utilizarse para la seguridad de otros protocolos de la capa de aplicación, como pueden ser FTP o SMTP. Es solo una versión actualizada y más segura de SLL.

Ambos protocolos utilizan tanto cifrado simétrico como asimétrico. Debido a que el cifrado asimétrico es demasiado costoso, se utiliza el cifrado simétrico para el intercambio de los mensajes. Como el cifrado asimétrico es más seguro y garantiza la autenticación, el mensaje inicial se realiza mediante este tipo de cifrado. Por último, garantiza la integridad de los mensajes mediante funciones hash.

### 2.1. Caracterización de la programación concurrente, paralela y distribuida

La concurrencia es la propiedad por la cual los sistemas tienen la capacidad de ejecutar diferentes procesos en un mismo tiempo. Un proceso es el conjunto de instrucciones que se van a ejecutar.

La programación concurrente es la que se encarga de ejecutar las tareas simultáneamente. Hay que tener en cuenta que toda ejecución simultánea debe tener unas características especiales, como, por ejemplo, la secuencia de ejecución, las comunicaciones entre los procesos y el acceso coordinado a los recursos.

Ventajas de la programación concurrente:

- Facilita el diseño orientado a objetos.
- Posibilita la compartición de recursos.
- Facilita la programación de aplicaciones en tiempo real.
- Reduce los tiempos de ejecución.

Cada programa se compone de diferentes instrucciones que pueden ser ejecutadas o no simultáneamente. Bernstein dividió las instrucciones en dos tipos, dependiendo de la operación realizada sobre ellas: de lectura y de salida.

Para que dos instrucciones se puedan ejecutar concurrentemente, es necesario que se cumplan estas tres condiciones:

- L(Si) ∩ E(Sj) = Ø
- E(Si) ∩ L(Sj) = Ø
- E(Si) ∩ E(Sj) = Ø

#### Veamos un ejemplo:

A partir del siguiente conjunto de instrucciones, hay que indicar las que se pueden ejecutar concurrentemente:

|Instrucción|Operación|
|---|---|
|Instrucción 1 (I1)|a = x + z|
|Instrucción 2 (I2)|x = b|
|Instrucción 3 (I3)|y = b + c|

En primer lugar es necesario formar 2 conjuntos de instrucciones: - Conjunto de lectura → formado por instrucciones que cuentan con variables a las que se accede en modo lectura durante su ejecución.

L(I1) = {x,z} L(I2) = {b} L(I3) = {b,c}

- Conjunto de escritura → formado por instrucciones que cuentan con variables a las que se accede en modo escritura durante su ejecución.

E(I1) = {a} E(I2) = {x} E(I3) = {y}

Para que dos conjuntos se puedan ejecutar concurrentemente se deben cumplir estas 3 condiciones:

- L(Si) ∩ E(Sj) = Ø
- E(Si) ∩ L(Sj) = Ø
- E(Si) ∩ E(Sj) = Ø

Aplicando estas tres condiciones a cada pareja de instrucciones podemos descubrir cuales se pueden ejecutar concurrentemente y cuáles no.

**Conjunto de I1 e I2** → L(S1) ∩ E(S2) = Ø, E(S1) ∩ L(S2) = Ø, E(S1) ∩ E(S2) = Ø

**Conjunto de I1 e I3** → L(S1) ∩ E(S3) = Ø, E(S1) ∩ L(S3) = Ø, E(S1) ∩ E(S3) = Ø

**Conjunto de I2 e I3** → L(S2) ∩ E(S3) = Ø, E(S2) ∩ L(S3) = Ø, E(S2) ∩ E(S3) = Ø

Por lo tanto, las instrucciones que se pueden ejecutar concurrentemente son: I1 con I3, e I2 con I3.

**Problemas de la programación concurrente**

- Exclusión mutua: es el resultado de que dos procesos intenten acceder a la misma variable. Esto puede producir inconsistencia, puesto que un proceso puede estar actualizando una variable, mientras que otro proceso está leyendo la misma. Para evitar este problema, en la programación concurrente se utiliza la región crítica, que controla el número de procesos que se encuentra utilizando el recurso.

- Abrazo mortal: dos procesos se quedan bloqueados porque están esperando a los recursos que tiene el otro proceso. También es denominado DeadLock o interbloqueo.

- Inanición: un proceso se queda esperando a un recurso compartido, que siempre se le deniega. Sin este recurso el proceso no puede finalizar.

### 2.2. Identificación de las diferencias entre los paradigmas de programación paralela y distribuida

- Permite la ejecución de tareas de manera simultánea.

#### -Disminuye el tiempo en ejecución.

#### Inconvenientes de la programación paralela:

#### -Mayor dificultad en la programación.

- Mayor complejidad en el acceso a los datos.

Este tipo de memoria permite ser accedida por múltiples programas, por lo que es un modo eficaz de transferencia de datos. Esto se consigue creando un espacio de acceso común por parte de cada uno de los procesos en la memoria RAM.

Hay que tener en cuenta que uno de los mayores problemas se da cuando existe un punto de acceso en común, como son las secciones críticas.

Es necesario establecer una serie de controles dentro de un punto de acceso a datos común, puesto que estos procesos intentarán realizar lectura y escritura de datos a la vez, dando lugar a datos incoherentes. Existen diversos mecanismos de control como son: semáforos, tuberías, monitores, etc. Estos permitirán el acceso de los hilos de manera individual, asegurando que las operaciones realizadas son de forma atómica, es decir, hasta que un hilo no termina, otro no puede acceder al mismo espacio de memoria.

#### -Modelo de paso de mensaje

Es el mecanismo más utilizado en la programación orientada a objetos. Cada proceso tiene definidas sus funciones y métodos, por lo que cada uno de ellos ejecuta individualmente las tareas y, si necesita datos de otro, realiza una petición de los resultados que necesita al propietario.

El principal inconveniente es que todos los procesos deben tener implementados métodos que puedan interpretar este intercambio de mensajes.

- Programación distribuida Este tipo de técnica de programación permite que un conjunto de máquinas separadas físicamente, que están interconectadas entre sí por una red de comunicaciones, trabaje como una sola para dar solución a un problema. Cada una procesa de manera independiente una parte del total. Este conjunto de máquinas que operan interconectadas se conoce como grid.

Esta programación se utiliza en la computación de altas prestaciones, en la que las máquinas son configuradas específicamente para cada tipo de escenario y se dan necesidades de computaciones de manera remota. Está enfocada a sistemas distribuidos cliente-servidor que requieren de escalabilidad y con una gran capacidad de tolerancia a fallos, puesto que cada uno opera de manera independiente y en caso de fallo no repercute en el de los demás. La comunicación entre estas máquinas se realiza mediante la llamada de procedimientos remotos (RPC), invocación remota de objetos (RMI) y sockets.

- **Alta disponibilidad**: es una de las características más usadas, que permite a este tipo de programación una flexibilidad enorme, en caso de que haya un fallo automáticamente los servicios son asignados en otros servidores.

De la misma manera que si la previsión de recursos necesarios se queda justa, es posible que de manera automática se añada una nueva máquina con las mismas características, para poder hacer frente a la computación de distintos procesos.

Por el contrario, este tipo de programación también cuenta con algunos inconvenientes como puede ser un aumento de la complejidad, ya que es necesario un determinado tipo de software. Asimismo, se incrementa el riesgo de fallos en la seguridad, como pueden ser los ataques de denegación de servicios con sobrecargas de peticiones remotas al servidor.

### 2.3. Identificación de los estados de un proceso

En primer lugar, es necesario definir qué es un proceso. Un proceso es un conjunto de instrucciones que se van a ejecutar dentro de la CPU.

Todo proceso está caracterizado por un indicador que define la situación o estado en el que se encuentra. Al menos existen tres estados diferentes:

- Activo o en ejecución: aquellos procesos que han sido asignados para ejecutarse en el procesador.
- Bloqueado: aquellos procesos que han interrumpido su ejecución, y, por lo tanto, se encuentran actualmente a la espera de que termine la operación que los ha dejado bloqueados.
- Preparado: aquellos procesos que se encuentran disponibles para entrar a la CPU y ejecutarse.
Durante la vida de un proceso, se realizan transiciones entre los diferentes estados. En el siguiente diagrama se muestran las distintas transiciones permitidas:

- Transición bloqueo: cuando un proceso se está ejecutando y produce una llamada al sistema, debe quedarse como bloqueado para evitar consumir CPU. Por ejemplo, cuando un proceso requiere información y pide que se lean datos. En este caso, debe esperar a que se complete esa operación.

- Transición apropiación: cuando un proceso se encuentra en ejecución y el gestor de procesos indica que debe dejar de ejecutarse. En este caso, el proceso sale de la CPU hasta que puede volver a estar activo. En el próximo apartado se verán las diferentes técnicas por las cuales un proceso realiza esta transición.
- Transición asignación: cuando un proceso entra a ejecutarse en la CPU.
- Transición fin de bloque: cuando un proceso está esperando a que acabe la operación por la cual ha pasado a estar en el estado de bloqueo y pasa directamente a seguir su ejecución.

Cabe destacar que existen varios estados nuevos, como pueden ser:

- Nuevo: aquellos procesos que aún no han sido elegidos para iniciar su procesamiento.
- Terminado: aquellos procesos que han finalizado su ejecución.
- Zombies: aquellos procesos que han finalizado su ejecución, pero no han liberado los recursos que han utilizado.
El sistema operativo debe agrupar la información de todos los procesos del sistema. Esta información se encuentra en el bloque de control del proceso (BCP), que se crea a la vez que el proceso. Cuando el proceso es eliminado se borra también toda esta información.
