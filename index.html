`# Tema 1. Qué son los lenguajes de marcas

Los lenguajes de marcas son herramientas fundamentales en el mundo de la informática, utilizadas para estructurar, describir y organizar datos. Estos lenguajes han demostrado ser versátiles y esenciales en múltiples contextos desde su uso en el diseño web hasta la integración de sistemas complejos. Este capítulo explora los conceptos básicos y las principales características de los lenguajes de marcas, centrándose en el estándar **XML (eXtensible Markup Language) como ejemplo destacado.**

### 1.1. Conceptos generales

Un lenguaje de marcas es un sistema de codificación que utiliza etiquetas ("marcas") para identificar elementos dentro de un documento. Estas etiquetas no son visibles en el resultado final (por ejemplo, en una página web o un documento generado) pero determinan cómo debe interpretarse o presentarse el contenido.

Además, permiten estructurar, definir y presentar información de forma organizada. Se utilizan ampliamente en la creación de documentos digitales, sistemas de intercambio de datos y diseño web, destacando por su versatilidad y facilidad de uso.

Por ejemplo, en HTML (HyperText Markup Language), una etiqueta como <h1> indica un título principal dentro de una página web.

#### Características principales

- **Estructura jerárquica: los lenguajes de marcas suelen organizar** la información en una estructura jerárquica basada en árboles, lo que facilita la representación de datos complejos.
- **Legibilidad: aunque están destinados principalmente a las má-** quinas, los lenguajes de marcas son legibles para los humanos, lo que facilita su creación y depuración.
- **Independencia del formato: los lenguajes de marcas separan el** contenido de su presentación, permitiendo que un mismo documento pueda ser visualizado en distintos dispositivos o formatos.
- **Extensibilidad: algunos lenguajes de marcas, como XML, permi-** ten crear nuevas etiquetas adaptadas a las necesidades específicas de los usuarios o aplicaciones.

#### Tipos de lenguajes de marcas

Los lenguajes de marcas pueden clasificarse según su propósito principal:

- **Lenguajes de descripción de documentos: diseñados para es-** tructurar y presentar documentos, como HTML y LaTeX.
- **Lenguajes de intercambio de datos: se utilizan para transferir** datos entre sistemas de manera estructurada, como XML y JSON (aunque este último no usa etiquetas).
- **Lenguajes de presentación: orientados a la definición del estilo y** la apariencia de los datos, como CSS.
- **Lenguajes especializados: diseñados para aplicaciones específi-** cas, como MathML, para expresiones matemáticas o SVG o para gráficos vectoriales.
#### Aplicaciones comunes

- **Diseño web: lenguajes como HTML y CSS son la base de las pági-** nas web modernas.
- **Intercambio de datos: XML es ampliamente usado en la comuni-** cación entre aplicaciones.
- **Documentación científica: laTeX facilita la creación de documen-** tos técnicos de alta calidad.
- **Almacenamiento de datos: archivos XML o JSON son comunes en** configuraciones y bases de datos.
**Beneficios**

- **Estandarización: promueven la interoperabilidad al seguir están-** dares definidos por organismos como el W3C.
- **Portabilidad: los documentos marcados pueden interpretarse en** diferentes plataformas y sistemas.
- **Escalabilidad: permiten manejar desde documentos simples has-** ta sistemas complejos con millones de registros.
Los lenguajes de marcas son una pieza fundamental en la gestión de la información digital. Su flexibilidad, legibilidad y capacidad para adaptarse a diversas aplicaciones los convierten en herramientas esenciales para desarrolladores y profesionales en el área de la tecnología.

### 1.2. Clasificación

Los lenguajes de marcas pueden clasificarse en función de su propósito y uso. A continuación, se presentan las principales categorías:

#### Lenguajes de marcas para estructuración de datos

Estos lenguajes se utilizan para organizar y estructurar información de forma jerárquica, facilitando su almacenamiento, intercambio y procesado.

**Ejemplos:**

- **XML (eXtensible Markup Language): permite estructurar infor-** mación de manera flexible y extensible. Se utiliza en documentos, configuraciones y bases de datos.
- **JSON (JavaScript Object Notation): aunque técnicamente no es** un lenguaje de marcas, se usa ampliamente como alternativa ligera a XML para estructurar datos.
#### Lenguajes de marcas para el diseño web

Se emplean para definir la estructura, presentación y funcionalidad de las páginas web.

**Ejemplos:**

- **HTML (HyperText Markup Language): define la estructura de las** páginas web mediante etiquetas que representan encabezados, párrafos, enlaces, imágenes, etc.
- **CSS (Cascading Style Sheets): no es un lenguaje de marcas puro,** pero complementa a HTML definiendo estilos y presentación visual.
#### Lenguajes de marcas especializados

Diseñados para necesidades específicas en sectores concretos.

**Ejemplos:**

- **SVG (Scalable Vector Graphics): se emplea para la descripción** de gráficos vectoriales en 2D.
- **MathML (Mathematical Markup Language): acostumbra a** usarse para representar expresiones matemáticas en páginas web y documentos.
- **RSS (Really Simple Syndication): usado para sindicación de con-** tenido, como noticias y blogs.

#### Lenguajes de marcas basados en estándares específicos

Estos lenguajes suelen estar diseñados con la finalidad de cumplir con ciertos estándares y facilitar la interoperabilidad entre sistemas.

**Ejemplos:**

- **XHTML (eXtensible HyperText Markup Language): combina HTML** y XML para garantizar documentos más estrictos y compatibles.
- **SOAP (Simple Object Access Protocol): utilizado en servicios** web para el intercambio de información entre aplicaciones.
#### Lenguajes de marcas propios o personalizados

Permiten crear lenguajes adaptados a las necesidades de una organización o aplicación. Estos lenguajes personalizados generalmente están basados en XML.

**Ejemplo:**

- Un lenguaje de marcas diseñado para el sector educativo, como
#### SCORM (Sharable Content Object Reference Model), que se usa

en plataformas de e-learning.

### 1.4. XML: estructura, sintaxis y etiquetas

El XML (eXtensible Markup Language) es un lenguaje de marcas que permite definir y estructurar datos de forma sencilla y legible tanto para humanos como para máquinas. Se utiliza ampliamente en aplicaciones web, bases de datos y sistemas de intercambio de información.

A continuación, se explican los conceptos básicos relacionados con su estructura, sintaxis y etiquetas.

#### Estructura de un documento XML

Este tipo de documento consta de varias partes principales que forman su estructura:

1. **Declaración XML (opcional, pero recomendada):** – Es la primera línea del documento y especifica la versión de XML y la codificación utilizada. **Ejemplo:** <?xml version="1.0" encoding="UTF-8"?>
2. **Elemento raíz:** – Es el contenedor principal de todos los elementos del documento. Solo puede haber un único elemento raíz. **Ejemplo:** <libro> <!-- Otros elementos --> </libro>
3. **Elementos secundarios:** – Representan las partes internas del documento y están anidados dentro del elemento raíz.

**Ejemplo:**

<libro> <titulo>Lenguaje de Marcas</titulo> <autor>Profesor Informática</autor> <editorial>Educación Digital</editorial> </libro>

4. **Atributos:** – Proporcionan información adicional sobre un elemento en forma de pares nombre="valor". **Ejemplo:** <libro categoria="educativo"> <titulo>Lenguaje de Marcas</titulo> </libro>
#### Sintaxis de XML

Para que un documento XML sea válido y esté bien formado, debe cumplir con una serie de reglas sintácticas:

1. **Cierre de etiquetas obligatorio:** – Cada etiqueta de apertura debe tener su correspondiente etiqueta de cierre. Correcto: <titulo>Lenguaje de Marcas</titulo> Incorrecto: <titulo>Lenguaje de Marcas

Un documento bien formado es el punto de partida para utilizar XML de manera eficiente, asegurando que sea interoperable y compatible con diferentes aplicaciones y sistemas.

### 1.6. El espacio de nombres en XML

El espacio de nombres en XML (o XML Namespace) es una característica que permite evitar conflictos entre nombres de elementos y atributos en un documento XML cuando se combinan vocabularios de diferentes fuentes. Esto se logra utilizando identificadores únicos, generalmente en forma de URIs (Uniform Resource Identifiers).

**Declaración del espacio de nombres**

Un espacio de nombres se declara utilizando el atributo \`xmlns\` (abreviatura de XML Namespace) en un elemento. Se puede aplicar a:

1. Un elemento y sus descendientes.
2. Atributos específicos mediante un prefijo.

#### Espacio de nombres con prefijo

Se declara con un prefijo que se asocia al URI del espacio de nombres, permitiendo su uso explícito en los elementos.

<biblioteca xmlns:lib="[http://www.ejemplo.com/li-](http://www.ejemplo.com/li-) bros"> <lib:libro> <lib:titulo>Lenguaje de Marcas</lib:titulo> </lib:libro> </biblioteca>

#### Uso de espacios de nombres en atributos

Los espacios de nombres no se aplican automáticamente a los atributos, excepto cuando se utilizan prefijos explícitos.

<lib:libro xmlns:lib="[http://www.ejemplo.com/libros"](http://www.ejemplo.com/libros")> <lib:titulo>Lenguaje de Marcas</lib:titulo> <lib:autor categoria="educativo">Tever</lib:autor> </lib:libro>

#### Resolución de conflictos

El uso de prefijos permite combinar elementos de diferentes vocabularios sin conflictos.

<documento xmlns:lib="[http://www.ejemplo.com/libros"](http://www.ejemplo.com/libros") xmlns:rev="[http://www.ejemplo.com/revistas"](http://www.ejemplo.com/revistas")> <lib:libro> <lib:titulo>Lenguaje de Marcas</lib:titulo> <lib:autor>Tever</lib:autor> </lib:libro> <rev:revista> <rev:titulo>Programación Moderna</rev:titulo> <rev:editor>Revistas Digitales</rev:editor> </rev:revista> </documento>

### 2.2. Estructura básica de un documento HTML5

La estructura básica de un documento HTML5 está compuesta por las etiquetas principales que definen el contenido y la semántica de la página.

<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Título del Documento</title> </head> <body> <!-- Contenido principal de la página --> </body> </html>

#### Explicación de cada elemento

#### <!DOCTYPE html>

Es la declaración del tipo de documento. Informa al navegador que se está utilizando HTML5.

#### <html lang="es">

Es la etiqueta raíz del documento. El atributo lang="es" especifica que el idioma principal del contenido es español.

**<head>**

Contiene información meta del documento que no se muestra directamente en la página. Algunos elementos importantes dentro de <head> son:

- <meta charset="UTF-8">: Define la codificación de caracteres como UTF-8, permitiendo mostrar caracteres especiales correctamente.

- <meta name="viewport" content="width=device-width, initial-scale=1.0">: Optimiza la visualización en dispositivos móviles.
- <title>: Establece el título de la página que aparece en la pestaña del navegador.
**<body>**

Contiene el contenido visible de la página, como texto, imágenes, videos, enlaces y otros elementos interactivos.

Esta estructura es la base para cualquier documento HTML5 y puede expandirse según las necesidades del proyecto.

- **Contenido: texto o elementos dentro de las etiquetas.**

#### – Limitaciones:

- Dependencia de etiquetas no semánticas para el diseño.

4. **HTML 4.0 (1997)**
#### – Características principales:

- Introducción de hojas de estilo en cascada (CSS) para separar contenido y diseño.
- Soporte para scripting con JavaScript.
- Tres tipos de documento: ▪ **Estricto (Strict): solo permitía etiquetas semánticas, sin** diseño inline. ▪ **Transicional (Transitional): permitía algunas etiquetas** no recomendadas. ▪ **Frameset: permitía el uso de frames en la página.**
#### – Limitaciones:

- La implementación inicial de CSS y JavaScript era inconsistente entre navegadores.
5. **XHTML 1.0 (2000)**
#### – Características principales:

- Basado en XML, lo que requería una sintaxis más estricta.
- Uso obligatorio de etiquetas cerradas, atributos en minúsculas y comillas.
#### – Ventajas:

- Mejor interoperabilidad con otras tecnologías basadas en XML.
#### – Desventajas:

- Sintaxis estricta que dificultaba la migración desde HTML
4.0.
6. **HTML5 (2014)** – **Versión actual y estándar más reciente.**
#### – Características principales:

- Introducción de etiquetas semánticas como <header>, <footer>, <article> y <section>.
- Soporte nativo para multimedia con <audio> y <video>.
- Integración de gráficos avanzados mediante <canvas> y SVG.
- APIs para funcionalidades avanzadas, como geolocalización, almacenamiento local (localStorage) y aplicaciones web offline.

- Compatibilidad con dispositivos móviles a través de etiquetas como <meta name="viewport">.
- Eliminación de etiquetas obsoletas como <font>, <center> y <applet>.
#### – Ventajas:

- Flexibilidad y compatibilidad con navegadores modernos.
- Mejora en la accesibilidad y el SEO.
Para entender mejor los cambios en las versiones de HTML, vamos a mostrarlo en una tabla resumen.

|Versión|Año|Características clave|Limitaciones principales|
|---|---|---|---|
|HTML 1.0|1991|Estructura básica del texto.|Sin estilos ni interactividad.|
|HTML 2.0|1995|Formularios y validación básica.|Sin soporte avanzado para diseño.|
|HTML 3.2|1997|Tablas y diseño con atributos inline.|Dependencia de etiquetas no semánticas.|
|HTML 4.0|1997|CSS, JavaScript, tres tipos de documento.|Compatibilidad limitada entre navegadores.|
|XHTML 1.0|2000|Sintaxis basada en XML.|Muy estricta y difícil de implementar.|
|HTML5|2014|Multimedia, semántica, APIs avanzadas.|Requiere navegadores modernos para pleno uso.|

### 2.6. Herramientas de diseño web

### 2.7. Sindicación de contenidos

La sindicación de contenidos es un mecanismo que permite compartir y distribuir información de un sitio web a otros medios o plataformas de forma automática. Su objetivo principal es mantener a los usuarios actualizados sobre nuevas publicaciones sin que tengan que visitar directamente el sitio.

#### ¿Qué es la sindicación de contenidos?

Consiste en usar formatos estándares, como RSS o Atom, para compartir contenido estructurado. Los usuarios o aplicaciones suscritas a estos canales pueden recibir actualizaciones automáticas en tiempo real sobre las publicaciones más recientes.

#### Términos clave

- **RSS (Really Simple Syndication): formato ampliamente utilizado** para la sindicación de contenido web, basado en XML.
- **Atom: alternativa a RSS, también basado en XML, pero con mejo-** ras en extensibilidad y estándares.
- **Feed (acnal): archivo que comprende el contenido sindicado. Los** usuarios pueden suscribirse a este para recibir actualizaciones.
#### ¿Cómo funciona la sindicación?

#### Generación del feed

- El sitio web genera un archivo XML que contiene las últimas actualizaciones (noticias, artículos, etc.).
- Este archivo se actualiza automáticamente cada vez que se publica nuevo contenido.
#### Distribución del feed

- Los usuarios o aplicaciones acceden al feed a través de lectores de RSS o integraciones con otras plataformas.
#### Consumo del contenido

- Los usuarios visualizan los titulares, resúmenes o contenido completo desde el lector de feeds o una aplicación compatible.

#### Ejemplo de un feed RSS:

<?xml version="1.0" encoding="UTF-8" ?> <rss version="2.0"> <channel> <title>Noticias de Tecnología</title> <link>[https://example.com](https://example.com)</link> <description>Las últimas noticias sobre tecnología.</description> <item> <title>Nuevo smartphone revolucionario</ title> <link>[https://example.com/nuevo-smartpho-](https://example.com/nuevo-smartpho-) ne</link> <description>Conoce las características del nuevo smartphone que está cambiando el mercado.</ description> </item> </channel> </rss>

#### Ventajas de la sindicación de contenidos

#### Para los usuarios

- **Acceso rápido: reciben actualizaciones sin necesidad de visitar el** sitio web.
- **Personalización: pueden suscribirse solo al contenido que les** interesa.
- **Ahorro de tiempo: centralizan información de diferentes fuentes** en un único lector de feeds.

#### Para los creadores de contenido

- **Mayor alcance: permite distribuir contenido en múltiples plataformas.**
- **Aumento del tráfico: los enlaces en los feeds redirigen a los usua-** rios al sitio original.
- **Automatización: las actualizaciones son automáticas, ahorrando** tiempo en la distribución.
#### Desventajas de la sindicación de contenidos

- **Limitación de formatos: los feeds no admiten diseños visuales** complejos, lo que puede restar atractivo al contenido.
- **Contenido duplicado: puede generar problemas de SEO si se dis-** tribuyen versiones completas del contenido.
- **Control limitado: una vez publicado el feed, el creador no tiene** control sobre cómo o dónde se utiliza.
#### Herramientas para la sindicación de contenidos

#### Creación de feeds

- **CMS: sistemas como WordPress y Drupal generan feeds automá-** ticamente.
- **Generadores de feeds RSS: herramientas como Feedity o RSS.** app.
#### Lectores de feeds

- **Feedly: uno de los lectores de RSS más populares.**
- **Inoreader: ofrece opciones avanzadas para gestión de feeds.**
- **NewsBlur: ideal para organizar y leer contenido desde diferentes** dispositivos.
#### Plataformas de distribución

- **IFTTT: automatiza la publicación de contenido RSS en redes** sociales.
- **Zapier: conecta feeds con otras herramientas para maximizar su** alcance.

#### Aplicaciones prácticas de la sindicación de contenidos

- **Medios de comunicación: mantienen a los lectores informados** sobre noticias recientes.
- **Blogs y sitios especializados: difunden artículos y publicaciones** entre audiencias interesadas.
- **E-commerce: publican automáticamente nuevos productos, ofer-** tas o actualizaciones en su catálogo.
- **Educación: distribuyen recursos y actualizaciones en plataformas** de aprendizaje.
La sindicación de contenidos sigue siendo una herramienta clave para distribuir información de forma eficiente, manteniendo la conexión entre los creadores de contenido y su audiencia de manera automatizada y organizada.

### 2.8. Estándares web

En la era digital actual, la web es una plataforma vital para la comunicación, el comercio y la información. Para garantizar que esta plataforma sea accesible, segura y funcional para todos los usuarios, se han establecido los estándares web.

Los estándares web son un conjunto de especificaciones técnicas y directrices desarrolladas y mantenidas por organizaciones internacionales como el World Wide Web Consortium (W3C), el Internet Engineering Task Force (IETF), y otros cuerpos de estandarización. Estos estándares definen cómo se deben construir y presentar los sitios y aplicaciones web para asegurar que sean accesibles y funcionen de manera consistente en diferentes navegadores y dispositivos.

Estos estándares son un conjunto de normas y directrices diseñadas para promover la interoperabilidad y la consistencia en la creación y el uso de contenidos y aplicaciones web.

#### Descripción y características

**Interoperabilidad**

- **Descripción: los estándares web aseguran que los sitios y apli-** caciones web funcionen de manera consistente en diferentes navegadores, dispositivos y sistemas operativos.
- **Características:** – Permiten a los desarrolladores crear una sola versión de su contenido que funcionará en todas partes. – Reducen la necesidad de pruebas exhaustivas en múltiples plataformas.
**Accesibilidad**

- **Descripción: los estándares web promueven la creación de con-** tenido accesible para todos los usuarios, incluyendo aquellos con discapacidades.
- **Características:** – Incluyen directrices como las Pautas de Accesibilidad para el Contenido Web (WCAG). – Fomentan el uso de etiquetas semánticas y atributos ARIA para mejorar la experiencia de los usuarios con tecnologías asistivas.
**Usabilidad**

- **Descripción: los estándares web ayudan a mejorar la experiencia** del usuario al definir prácticas recomendadas para la navegación y la interacción.
- **Características:** – Proporcionan directrices para la estructura y la presentación de la información. – Ayudan a crear interfaces intuitivas y fáciles de usar.

**Seguridad**

- **Descripción: los estándares web incluyen especificaciones para** asegurar que los datos de los usuarios y las aplicaciones estén protegidos contra amenazas.
- **Características:**
#### – Definen protocolos seguros como HTTPS.

  - Incluyen recomendaciones para la gestión de sesiones y la protección contra ataques como XSS y CSRF.

#### Desarrollo sostenible

- **Descripción: los estándares web fomentan prácticas de desarrollo** sostenibles y mantenibles.
- **Características:** – Promueven el uso de código limpio y modular. – Fomentan la adopción de tecnologías emergentes que mejoran la eficiencia y el rendimiento.
#### Principales estándares web

#### HTML (HyperText Markup Language)

- Es el estándar fundamental para la creación de páginas web. Define la estructura y el contenido de los documentos web.
- Organización: W3C.
#### CSS (Cascading Style Sheets)

- Define cómo se presentan los elementos HTML en la pantalla, en papel, o en otros medios.
- Organización: W3C.
#### JavaScript (ECMAScript)

- Se trata de lenguaje de programación utilizado para crear contenido interactivo y dinámico en la web.
- Organización: ecma International.

#### HTTP/HTTPS (HyperText Transfer Protocol / Secure)

- Protocolo utilizado para la transferencia de datos a través de la web. HTTPS es la versión segura de HTTP.
- Organización: IETF.
#### SVG (Scalable Vector Graphics)

- Consiste en un formato de imagen vectorial utilizado para definir gráficos bidimensionales y gráficos vectoriales.
- Organización: W3C.
**XML**

- Si bien XML no se utiliza directamente para crear páginas web como HTML, es un estándar web importante porque define una forma estructurada y extensible de almacenar y transportar datos.
- Organización: W3C.
Los estándares web son esenciales para el desarrollo de una web accesible, interoperable, segura y usable. Al adherirse a estos estándares, los desarrolladores pueden asegurarse de que sus aplicaciones y sitios web sean accesibles para el mayor número posible de usuarios y dispositivos, proporcionando una experiencia de usuario consistente y de alta calidad. Las organizaciones de estandarización como el W3C y la IETF continúan evolucionando estos estándares para adaptarse a los cambios tecnológicos y las necesidades emergentes del entorno web.`

`# Tema 3. Hojas de estilo

Este capítulo aborda las hojas de estilo (CSS) como una herramienta fundamental en el desarrollo web, que permite definir y controlar la apariencia de los elementos HTML de manera eficiente y separada del contenido. Las hojas de estilo garantizan un diseño uniforme, adaptable y fácil de mantener, mejorando significativamente la experiencia del usuario.

CSS proporciona la capacidad de modificar colores, fuentes, tamaños, márgenes, fondos, bordes y disposición de los elementos, permitiendo la creación de diseños visuales atractivos y dinámicos. Además, facilita la adaptación a distintos dispositivos mediante técnicas como media queries, unidades relativas y el uso de layouts avanzados con Flexbox y Grid.

También se destaca el uso de frameworks como BulmaCSS, que simplifican el diseño mediante clases predefinidas y garantizan un diseño responsive. La aplicación correcta de estas herramientas permite crear sitios web modernos, funcionales y visualmente coherentes, alineados con las demandas actuales del entorno digital.

### 3.1. Qué es una hoja de estilo

Una hoja de estilo es un documento utilizado en el desarrollo web para definir la apariencia y el diseño de los elementos de una página. Se escribe en un lenguaje llamado CSS (Cascading **Style Sheets), que permite controlar cómo se muestran los** elementos HTML en el navegador.

Las hojas de estilo separan el contenido (HTML) de la presentación (CSS), facilitando el diseño, la coherencia visual y el mantenimiento de los sitios web.

#### Función de una hoja de estilo

- **Definir la apariencia de los elementos: permite modificar co-** lores, fuentes, tamaños, márgenes, alineación, bordes, y otros aspectos visuales.
- **Asegurar consistencia: una única hoja de estilo externa puede** aplicarse a varias páginas, garantizando un diseño uniforme.
- **Adaptarse a dispositivos: facilita la creación de diseños responsi-** vos que se ajustan a diferentes tamaños de pantalla (ordenadores, móviles, tablets).

#### Tipos de hojas de estilo

- **CSS en línea (Inline CSS): especifica estilos directamente dentro** de las etiquetas HTML mediante el atributo style. **Ejemplo:** <p style="color: red; font-size: 16px;">Texto con estilo en línea</p>
- **CSS interno (Internal CSS): se escribe dentro de la etiqueta** <style> en la sección <head> del documento HTML. **Ejemplo:** <head> <style> p { color: red; font-size: 16px; } </style> </head>
- **CSS externo (External CSS): se utiliza un archivo .css separado,** vinculado al documento HTML mediante la etiqueta <link>. **Ejemplo:** <head> <link rel="stylesheet" href="estilos.css"> </head>
#### Contenido del archivo estilos.css:

p { color: red; font-size: 16px; }

#### Ventajas de usar hojas de estilo

- **Separación de contenido y diseño: facilita la gestión y edición** de los archivos HTML y CSS.
- **Reutilización del código: una hoja de estilo externa puede apli-** carse a varias páginas web.

- **Mantenimiento eficiente: cambiar un estilo en el archivo CSS** afecta a todas las páginas que lo usan.
- **Diseños responsivos: CSS permite adaptar el diseño a diferentes** dispositivos y resoluciones.
#### Estructura básica de una hoja de estilo

Una hoja de estilo consta de reglas CSS organizadas en bloques de código. Cada regla incluye:

- **Selector: define a qué elementos HTML se aplicará el estilo.**
- **Declaración: especifica las propiedades y valores del estilo.**
**Ejemplo:**

p { color: blue; /* Cambia el color del texto a azul */ font-size: 18px; /* Ajusta el tamaño de la fuente a 18 píxeles */ }

Una hoja de estilo es una herramienta esencial en el diseño web moderno. Gracias a CSS, los desarrolladores pueden controlar y personalizar la apariencia de sus sitios, mejorando la experiencia del usuario y optimizando el proceso de desarrollo.

### 3.2. Sintaxis y estructura básica

CSS (Cascading Style Sheets) utiliza una sintaxis sencilla para definir los estilos de los elementos HTML. Comprender su estructura básica es esencial para aplicar y personalizar diseños en sitios web.

#### Estructura de una regla CSS

Una regla CSS consta de las siguientes partes:

selector { propiedad: valor; }

**Componentes**

- **Selector: indica a qué elementos HTML se aplicará el estilo.**
- **Propiedad: define qué aspecto del elemento se modificará (color,** tamaño, margen, etc.).
- **Valor: especifica el detalle que se aplicará a la propiedad.**
- **Llaves ({}): encierra las declaraciones de estilo.**
- **Punto y coma (;): separa múltiples declaraciones dentro de un** mismo bloque.
#### Ejemplo básico:

p { color: blue; /* Cambia el color del texto a azul */ font-size: 16px; /* Ajusta el tamaño de la fuente */ text-align: center; /* Centra el texto */ }

Donde:

- El selector es p (aplica a todos los párrafos <p>).
- Las propiedades son color, font-size y text-align.
- Los valores son blue, 16px y center.

#### Tipos de selectores

#### Selectores básicos

- **Elemento: aplica estilos a todas las etiquetas de ese tipo.** h1 { color: red; }
- **Clase (.clase): aplica estilos a los elementos con una clase específica.** .destacado { font-weight: bold; }
- **ID (#id): aplica estilos a un elemento único identificado por un ID.** #principal { background-color: lightgray; }
#### Selectores avanzados

- **Grupo de selectores: aplica el mismo estilo a varios elementos.** h1, h2, h3 { color: green; }
- **Selectores descendientes: aplica estilos a los elementos dentro** de un contenedor. div p { color: purple; }
- **Selectores de atributos: aplica estilos a elementos con un atribu-** to específico. input[type="text"] { border: 1px solid black; }

- **Selectores pseudoclase: aplica estilos basados en un estado o** condición. a:hover { text-decoration: underline; }
- **Selectores pseudoelemento: aplica estilos a una parte específica** de un elemento. p::first-line { font-weight: bold; }
#### Declaraciones múltiples

Un bloque CSS puede contener varias declaraciones de propiedad y valor, separadas por punto y coma.

**Ejemplo:**

div { margin: 20px; padding: 10px; border: 2px solid black; }

#### Comentarios en CSS

Los comentarios se utilizan para describir el código y mejorar su legibilidad. No afectan la ejecución del estilo.

#### Sintaxis de comentario

/* Este es un comentario */

**Ejemplo:**

/* Cambia el color del texto a azul */ p { color: blue; }

#### Importancia de la cascada y especificidad

**Cascada**

- Si dos reglas se aplican al mismo elemento, la más específica tendrá prioridad.
- Si ambas tienen la misma especificidad, se aplica la última en el orden del archivo CSS.
**Especificidad**

- Determina qué regla tiene prioridad basándose en el tipo de selector.
- Orden de prioridad: ID > Clase > Elemento.
#### Ejemplo de conflicto:

p { color: red; }

#principal { color: blue; }

Si el párrafo tiene el ID principal, el color será azul.

La sintaxis y estructura de CSS es sencilla pero poderosa. Con una comprensión básica de selectores, propiedades y valores, es posible controlar la apariencia de un sitio web de manera eficiente y profesional.

### 3.3. Propiedades CSS básicas

Las propiedades CSS básicas son los atributos que permiten definir y personalizar la apariencia de los elementos HTML. Estas propiedades se organizan en categorías según su funcionalidad, como el estilo del texto, el fondo, el tamaño o la disposición de los elementos.

#### Propiedades de texto

Estas propiedades permiten estilizar y formatear el contenido textual.

#### Color del texto

color: red; /* Cambia el color del texto */

#### Tamaño de la fuente

font-size: 16px; /* Tamaño de la fuente en píxeles */

#### Tipo de fuente

font-family: Arial, sans-serif; /* Fuente principal y alternativa */

#### Estilo de fuente

font-style: italic; /* Texto en cursiva */

#### Grosor de la fuente

font-weight: bold; /* Texto en negrita */

#### Alineación del texto

text-align: center; /* Centra el texto */

#### Decoración del texto

text-decoration: underline; /* Subraya el texto */

#### Transformación del texto

text-transform: uppercase; /* Convierte el texto a mayúsculas */

#### Espaciado entre letras y líneas

letter-spacing: 2px; /* Espaciado entre letras */ line-height: 1.5; /* Altura de línea */

#### Propiedades de fondo

Controlan el color, la imagen y otros aspectos visuales del fondo.

#### Color de fondo

background-color: lightblue; /* Fondo azul claro */

#### Imagen de fondo

background-image: url("imagen.jpg"); /* Aplica una imagen como fondo */

#### Posición del fondo

background-position: center; /* Centra la imagen de fondo */

#### Tamaño del fondo

background-size: cover; /* Escala la imagen para cubrir todo el fondo */

#### Repetición del fondo

background-repeat: no-repeat; /* Evita que la imagen de fondo se repita */

#### Propiedades de borde

Definen los bordes de los elementos.

#### Estilo del borde

border-style: solid; /* Borde sólido */

#### Ancho del borde

border-width: 2px; /* Grosor del borde */

#### Color del borde

border-color: black; /* Color del borde */

#### Borde resumido

border: 2px solid black; /* Ancho, estilo y color del borde */

#### Esquinas redondeadas

border-radius: 10px; /* Bordes redondeados */

#### Propiedades de espacio

### 3.4. Diseño responsive

#### Propiedades adicionales

**Sombra** **¿Qué es el diseño responsive?**

box-shadow: 5px 5px 10px gray; /* Sombra alrededor del elemento */

**Opacidad**

opacity: 0.8; /* Hace el elemento ligeramente transparente */

#### Ejemplo práctico de propiedades CSS básicas:

body { background-color: #f0f0f0; /* Fondo gris claro */ font-family: Arial, sans-serif; /* Fuente principal */ color: #333; /* Texto gris oscuro */ margin: 0; /* Sin margen exterior */ padding: 0; /* Sin relleno interior */ }

h1 { text-align: center; color: #007bff; /* Azul */ font-size: 2em; }

p { line-height: 1.5; margin: 20px; text-indent: 20px; /* Sangría en el inicio del párrafo */ }

Estas propiedades básicas de CSS son esenciales para personalizar el diseño de un sitio web y garantizar una presentación profesional y atractiva.

El diseño responsive es un enfoque en el desarrollo web que busca garantizar que los sitios web se adapten correctamente a diferentes tamaños de pantalla y dispositivos, como teléfonos móviles, tablets, ordenadores portátiles y monitores de escritorio. Su objetivo principal es mejorar la experiencia del usuario independientemente del dispositivo utilizado.

El diseño responsive utiliza técnicas y herramientas como media queries, **unidades relativas, y layouts flexibles para que el contenido de una** página se ajuste dinámicamente a diferentes resoluciones de pantalla.

#### Características clave del diseño responsive

- **Adaptabilidad: el contenido y los elementos visuales se ajustan** automáticamente al tamaño del dispositivo.
- **Un diseño único: se evita crear versiones separadas para disposi-** tivos móviles y escritorio, simplificando el mantenimiento.
- **Optimización para dispositivos móviles: el diseño se enfoca en** pantallas más pequeñas primero (Mobile First) y luego escala a dispositivos más grandes.
#### Herramientas y técnicas del diseño responsive

#### Media queries

Las media queries son una característica de CSS que permite aplicar estilos dependiendo de las características del dispositivo, como el ancho de pantalla, la orientación o la resolución.

#### Ejemplo básico:

/* Estilo por defecto (escritorio) */ body { font-size: 16px; }

/* Estilo para dispositivos con un ancho máximo de 768px (tablets y móviles) */ @media (max-width: 768px) { body { font-size: 14px; } }

/* Estilo para dispositivos con un ancho máximo de 480px (móviles) */ @media (max-width: 480px) { body { font-size: 12px; } }

#### Unidades relativas

El uso de unidades relativas permite que los tamaños de los elementos se ajusten proporcionalmente.

- **Unidades relativas comunes:** – **em: relativo al tamaño de la fuente del elemento padre.** – **rem: relativo al tamaño de la fuente raíz (html).** – **%: relativo al tamaño del contenedor padre.** – **vh y vw: relativo al 1% del ancho o altura de la ventana gráfica.** **Ejemplo:** body { font-size: 1rem; /* Relativo al tamaño de la fuente base */ } div { width: 50%; /* Ocupa el 50% del ancho del contenedor padre */ height: 50vh; /* Ocupa el 50% de la altura de la ventana gráfica */ }

#### Layouts flexibles (Flexbox y Grid)

- **Flexbox: sistema de diseño unidimensional que distribuye ele-** mentos de manera flexible. **Ejemplo:** .container { display: flex; flex-wrap: wrap; /* Permite que los elementos se ajusten en varias líneas */ justify-content: center; /* Centra los elementos horizontalmente */ gap: 10px; /* Espacio entre elementos */ }
- **Grid: sistema de diseño bidimensional que organiza elementos en** filas y columnas. **Ejemplo:** .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Ajusta el número de columnas automáticamente */ gap: 15px; /* Espacio entre columnas y filas */ }
#### Imágenes y multimedia responsivos

- **Imágenes fluidas:** img { max-width: 100%; /* Ajusta el ancho al contenedor */ height: auto; /* Mantiene la proporción */ }
- **Videos responsivos: se utilizan contenedores con proporción fija.** .video-container { position: relative; padding-top: 56.25%; /* Relación 16:9 */ height: 0; } .video-container iframe { position: absolute;

top: 0; left: 0; width: 100%; height: 100%; }

#### Enfoque "Mobile First"

El diseño Mobile First comienza con la creación de estilos optimizados para dispositivos móviles y luego se amplía para pantallas más grandes. Esto asegura que la experiencia en móviles, donde se origina la mayoría del tráfico web, sea prioritaria.

#### Ejemplo de Mobile First:

/* Estilo por defecto (para móviles) */ body { font-size: 14px; }

/* Estilos para tablets y escritorio */ @media (min-width: 768px) { body { font-size: 16px; } }

@media (min-width: 1200px) { body { font-size: 18px; } }

#### Frameworks para diseño responsive

Los frameworks CSS incluyen componentes y clases predefinidas que facilitan la creación de diseños responsivos.

**Ejemplos:**

- **Bootstrap: sistema de rejillas y utilidades para diseño móvil y** responsive.
- **Bulma CSS: framework que destaca por su sencillez.**
- **Tailwind CSS: framework de utilidades altamente personalizable.**
- **Foundation: herramienta avanzada para diseño adaptativo.**

#### Ventajas del diseño responsive

- **Mejor experiencia del usuario: contenido accesible y legible en** cualquier dispositivo.
- **Optimización para SEO: google favorece los sitios responsivos en** los resultados de búsqueda.
- **Mantenimiento más fácil: un único diseño se adapta a múltiples** dispositivos, reduciendo el tiempo de desarrollo.
El diseño responsive es una práctica esencial en el desarrollo web moderno. Permite que los sitios se adapten automáticamente a diferentes dispositivos, mejorando la experiencia del usuario y maximizando el alcance del contenido. Con herramientas como media queries, unidades relativas y frameworks, los desarrolladores pueden crear sitios web visualmente atractivos y funcionales en cualquier entorno.

### 3.5. Layouts avanzados en CSS

Los layouts avanzados en CSS permiten organizar y distribuir el contenido de una página de manera flexible y eficiente. Estas técnicas, como **Flexbox y CSS Grid, son fundamentales para crear diseños modernos,** adaptables y responsivos.

#### Sistema Flexbox

Flexbox (Flexible Box) es un sistema unidimensional que organiza elementos en filas o columnas, ofreciendo un control preciso sobre la alineación, distribución y orden de los elementos.

#### Características principales

- Trabaja en un eje principal (horizontal o vertical) y un eje secundario (perpendicular al principal).
- Permite centrar y distribuir elementos de manera sencilla.
- Soporta elementos dinámicos y adaptables.

#### Propiedades principales de Flexbox

- **Contenedor flex:** .contenedor { display: flex; /* Activa Flexbox en el contenedor */ flex-direction: row; /* Dirección de los elementos: fila (por defecto) */ justify-content: space-between; /* Espaciado entre elementos */ align-items: center; /* Alineación vertical en el eje cruzado */ }
- **Elementos flexibles:** .elemento { flex-grow: 1; /* Hace que los elementos crezcan para llenar el espacio disponible */ flex-shrink: 0; /* Impide que los elementos se reduzcan */ flex-basis: 200px; /* Tamaño inicial del elemento */ }
- **Ejemplo práctico de Flexbox:** .contenedor { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 10px; /* Espaciado entre elementos */ } .elemento { background-color: lightblue; padding: 20px; border: 1px solid #000; } <div class="contenedor"> <div class="elemento">Elemento 1</div> <div class="elemento">Elemento 2</div> <div class="elemento">Elemento 3</div> </div>

#### Sistema CSS Grid

CSS Grid es un sistema de diseño bidimensional que permite organizar elementos en filas y columnas. Es ideal para diseños complejos que requieren una estructura clara y precisa.

#### Características principales

- Define áreas específicas para cada elemento.
- Soporta alineación avanzada tanto horizontal como verticalmente.
- Compatible con layouts adaptables y responsivos.
#### Propiedades principales de CSS Grid

- **Contenedor Grid:** .contenedor { display: grid; /* Activa Grid en el contenedor */ grid-template-columns: repeat(3, 1fr); /* Tres columnas de igual ancho */ grid-template-rows: auto 200px; /* Dos filas: la primera automática y la segunda fija */ gap: 10px; /* Espaciado entre filas y columnas */ }
- **Elementos de la Grid:** .elemento { grid-column: 2 / span 2; /* Ocupa desde la segunda columna y abarca dos columnas */ grid-row: 1 / 2; /* Ocupa la primera fila */ }
- **Ejemplo práctico de Grid:** .contenedor { display: grid; grid-template-columns: repeat(3, 1fr); /* Tres columnas iguales */ gap: 10px; background-color: #f0f0f0; padding: 10px; } .elemento { background-color: lightcoral; padding: 20px; text-align: center;

}

<div class="contenedor"> <div class="elemento">1</div> <div class="elemento">2</div> <div class="elemento">3</div> <div class="elemento">4</div> <div class="elemento">5</div> <div class="elemento">6</div> </div>

#### Sistema de rejillas híbrido (Grid + Flexbox)

Ambos sistemas pueden combinarse para lograr layouts más avanzados. Por ejemplo, usar CSS Grid para la estructura principal y Flexbox para la distribución interna de los elementos.

#### Ejemplo híbrido:

.contenedor { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }

.flex { display: flex; justify-content: space-between; align-items: center; background-color: lightgreen; padding: 10px; }

<div class="contenedor"> <div class="flex"> <div>Elemento A</div> <div>Elemento B</div> </div> <div class="flex"> <div>Elemento C</div> <div>Elemento D</div> </div> </div>

#### Diseño responsive con layouts avanzados

Combinar media queries con Flexbox o Grid permite crear diseños adaptables a diferentes resoluciones de pantalla.

#### Ejemplo de Grid responsive:

.contenedor { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Ajusta las columnas automáticamente */ gap: 15px; }

#### Ventajas de los layouts avanzados

- **Flexibilidad: permiten diseños adaptativos y escalables.**
- **Organización: mejoran la estructura y la disposición del contenido.**
- **Control preciso: facilitan el control de alineación, espacio y tama-** ño de los elementos. **Conclusión** Los layouts avanzados en CSS, como Flexbox y Grid, son herramientas poderosas para crear diseños modernos y responsivos. Su dominio permite a los desarrolladores estructurar el contenido de manera eficiente y optimizar la experiencia del usuario en cualquier dispositivo.

### 3.6. Tipografía en CSS

La tipografía en CSS se refiere al conjunto de propiedades que permiten controlar el estilo, tamaño, alineación y otras características del texto en una página web. La elección y personalización de la tipografía son fundamentales para mejorar la legibilidad, accesibilidad y la estética de un sitio web.

#### Propiedades principales de tipografía

#### Propiedad font-family

Define la fuente utilizada para el texto. Se pueden especificar varias fuentes como alternativas en caso de que alguna no esté disponible.

**Ejemplo:**

p { font-family: Arial, Helvetica, sans-serif; }

- **Arial: fuente principal.**
- **Helvetica: fuente alternativa.**
- **sans-serif: categoría genérica para fuentes sin remates.**
#### Propiedad font-size

Controla el tamaño de la fuente.

#### Unidades comunes:

- **Pixeles (px): tamaño absoluto.**
- **Ems (em) y rems (rem): tamaño relativo al elemento padre (em)** o raíz (rem).
- **Porcentajes (%): relativo al tamaño del texto del elemento padre.**
**Ejemplo:**

h1 { font-size: 2em; /* Dos veces el tamaño base */ }

#### Propiedad font-weight

Controla el grosor del texto.

#### Valores comunes:

- **normal: grosor estándar.**
- **bold: texto en negrita.**
- **100, 200, ..., 900: grosor numérico (100 más delgado, 900 más** grueso).
**Ejemplo:**

p { font-weight: bold; }

#### Propiedad font-style

Define si el texto estará en estilo normal, cursiva o inclinada.

**Ejemplo:**

blockquote { font-style: italic; }

#### Propiedad line-height

Controla el espacio vertical entre líneas de texto. Es importante para mejorar la legibilidad.

**Ejemplo:**

p { line-height: 1.5; /* 1.5 veces la altura del texto */ }

#### Propiedad letter-spacing

Ajusta el espacio entre caracteres.

**Ejemplo:**

h1 { letter-spacing: 2px; }

#### Propiedad text-align

Controla la alineación horizontal del texto.

#### Valores comunes:

- left: alineado a la izquierda.
- right: alineado a la derecha.
- center: centrado.
- justify: justificado.
**Ejemplo:**

p { text-align: justify; }

#### Propiedad text-transform

Cambia la capitalización del texto.

**Ejemplo:**

h2 { text-transform: uppercase; /* Todo en mayúsculas */ }

#### Propiedad text-decoration

Define decoraciones como subrayados, tachados o eliminaciones.

**Ejemplo:**

a { text-decoration: none; /* Sin subrayado */ }

#### Uso de fuentes personalizadas

#### Fuentes de sistema

Son fuentes preinstaladas en los dispositivos (Arial, Times New Roman, etc.).

#### Fuentes web con Google Fonts

Google Fonts permite incluir fuentes personalizadas en un sitio web.

**Ejemplo:**

Añadir el enlace en el <head> del HTML:

<link href="[https://fonts.googleapis.com/css2?fami-](https://fonts.googleapis.com/css2?fami-) ly=Roboto:wght@400;700&display=swap" rel="stylesheet">

#### Usar la fuente en CSS:

body { font-family: 'Roboto', sans-serif; }

#### Fuentes con @font-face

Permite incluir fuentes personalizadas directamente en el CSS.

**Ejemplo:**

@font-face { font-family: 'MiFuentePersonalizada'; src: url('mifuente.woff2') format('woff2'), url('mifuente.woff') format('woff'); }

h1 { font-family: 'MiFuentePersonalizada', sans-serif; }

#### Buenas prácticas en tipografía

- **Legibilidad: usa tamaños y colores que permitan una lectura** cómoda.
- **Consistencia: limita la cantidad de fuentes utilizadas (2 o 3 como** máximo).
- **Contraste: asegúrate de que el color del texto contraste adecua-** damente con el fondo.
- **Responsive: adapta los tamaños de las fuentes utilizando unida-** des relativas (em, rem, %).
- **Accesibilidad: usa la propiedad line-height y asegúrate de que los** textos sean comprensibles.

#### Ejemplo práctico de tipografía en CSS

body { font-family: 'Roboto', Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; background-color: #f9f9f9; margin: 0; padding: 20px; }

h1 { font-size: 2.5rem; font-weight: 700; text-align: center; margin-bottom: 20px; }

p { font-size: 1rem; letter-spacing: 0.5px; text-align: justify; }

a { color: #007bff; text-decoration: none; }

a:hover { text-decoration: underline; }

La tipografía en CSS es crucial para crear una experiencia de usuario atractiva y funcional. Con las propiedades adecuadas, los desarrolladores pueden diseñar páginas web que sean visualmente coherentes, legibles y accesibles para todos los usuarios.

### 3.7. BulmaCss-Un framework para CSS

- **PHP: se emplea principalmente para el desarrollo web del lado del** servidor.
- **Bash: utilizado para la creación de scripts de shell en sistemas** Unix y Linux.
Los lenguajes de script son herramientas esenciales en el arsenal de cualquier desarrollador, proporcionando una forma rápida y eficiente de automatizar tareas y desarrollar aplicaciones. Su simplicidad, flexibilidad y extensibilidad los hacen ideales para una amplia variedad de aplicaciones en el mundo de la tecnología.

### 4.1. JavaScript

#### JavaScript es uno de los lenguajes de programación más populares y fundamentales en el desarrollo web moderno. Su versatilidad y capacidad para ejecutarse lo han convertido en una herramienta indispensable para los desarrolladores.

Nacido en los años 90, JavaScript ha evolucionado desde ser un simple lenguaje de scripting para añadir interactividad a las páginas web hasta convertirse en un pilar esencial para la creación de aplicaciones web complejas y dinámicas.

Originalmente desarrollado por Netscape como un medio para agregar comportamientos dinámicos a los sitios web, JavaScript es ahora un estándar mantenido por ECMA International bajo la especificación ECMAScript.

**Características**

- **Interactividad del lado del cliente: JavaScript se ejecuta en el** navegador del usuario, lo que permite crear experiencias interactivas y dinámicas sin necesidad de recargar la página completa. Esto incluye la validación de formularios, la creación de efectos visuales y la actualización de contenido en tiempo real.
- **Orientado a objetos y basado en prototipos: a diferencia de** otros lenguajes orientados a objetos que utilizan clases, JavaScript usa prototipos para la herencia. Esto permite una gran flexibilidad en la creación y manipulación de objetos.
- **Lenguaje interpretado: es un lenguaje interpretado, lo que im-** plica que el código se ejecuta de forma secuencial en lugar de ser compilado previamente. Esto facilita la depuración y acelera el proceso de desarrollo.
- **Versatilidad y portabilidad: JavaScript puede ejecutarse en** cualquier dispositivo que tenga un navegador web, lo que lo hace extremadamente portátil.
- **Eventos y manipulación del DOM: JavaScript es fundamental para** la manipulación del Document Object Model (DOM), lo que permite a los desarrolladores cambiar dinámicamente la estructura, el contenido y el estilo de las páginas web en respuesta a eventos del usuario, como clics, movimientos del ratón y entradas de teclado.

- **Asincronía: JavaScript soporta operaciones asincrónicas median-** te callbacks, promesas y la sintaxis async/await. Esto es esencial para realizar tareas como la carga de datos desde un servidor sin bloquear la ejecución del código.
- **Amplio ecosistema y bibliotecas: JavaScript cuenta con una vas-** ta cantidad de bibliotecas y frameworks que facilitan el desarrollo de aplicaciones complejas. Algunos ejemplos populares son React, Angular y Vue.js, empleados para el desarrollo front-end, y Express.js para el desarrollo back-end con Node.js.
- **Compatibilidad con múltiples plataformas: gracias a su capa-** cidad de ejecución en navegadores web, servidores (a través de Node.js) y aplicaciones móviles (con frameworks como React Native), JavaScript es un lenguaje verdaderamente multiplataforma.
A continuación se muestra un pequeño ejemplo de cómo JavaScript puede ser utilizado para cambiar el contenido de una página web en respuesta a una interacción del usuario.

<!DOCTYPE html> <html> <head> <title>Ejemplo de JavaScript</title> <script> function mostrarMensaje() { alert("¡Hola, este es un mensaje de JavaScript!"); } <\/script> </head> <body> <button onclick="mostrarMensaje()">Haz clic aquí</button> </body> </html>

En este ejemplo, cuando el usuario hace clic en el botón, se ejecuta la función "mostrarMensaje".

JavaScript es un lenguaje de programación esencial en el desarrollo web moderno que proporciona las herramientas necesarias para crear aplicaciones interactivas, dinámicas y de alto rendimiento. Además, su versatilidad, facilidad de uso y amplio ecosistema lo convierten en una elección ideal tanto para desarrolladores novatos como para experimentados.

### 4.2. Elementos del lenguaje JavaScript

JavaScript, como cualquier lenguaje de programación, se compone de varios elementos y conceptos fundamentales que los desarrolladores utilizan para escribir código funcional y eficiente. Los principales elementos del lenguaje de JavaScript son los siguientes:

- **Variables: almacenan datos que pueden cambiar durante la eje-** cución del programa. var nombre = "Juan"; let edad = 30; const PI = 3.1416;
Las variables declaradas con var tienen un alcance de función o global. Si se declaran dentro de una función, solo son accesibles dentro de la misma. Si se declaran fuera de una función, tienen un alcance global, mientras que las variables declaradas con let tienen un alcance de bloque. Esto significa que solo son accesibles dentro del bloque de código donde se declararon.

- **Tipos de datos: incluyen primitivos como number, string, boo-** lean, null, undefined, y symbol. let numero = 10; let texto = "Hola"; let esVerdad = true; let valorNulo = null; let valorIndefinido;
- **Operadores aritméticos: +, -, *, /, %** let suma = 5 + 3; let resta = 5 - 3; let multiplicacion = 5 * 3; let division = 5 / 3; let modulo = 5 % 3;
- **Operadores de asignación: =, +=, -=, *=, /=, %=** let x = 10; x += 5; // x ahora es 15
- **Operadores de comparación: ==, ===, !=, !==, >, <, >=, <=** let esIgual = (5 == '5'); // true let esEstrictamenteIgual = (5 === '5'); // false

El operador ===, conocido como "igualdad estricta" o "triple igual", es un operador de comparación en JavaScript que verifica tanto el valor como el tipo de los operandos. A diferencia del operador ==, que realiza una conversión de tipo antes de comparar, === compara los operandos sin realizar ningún tipo de conversión, lo que lo hace más estricto y predictivo.

El uso de este operador en JavaScript es esencial para realizar comparaciones de igualdad estricta que tengan en cuenta tanto el valor como el tipo de los operandos. Su uso es una buena práctica que ayuda a evitar errores y hace que el código sea más seguro y fácil de mantener.

- **Operadores lógicos: &&, ||, !** let y = true && false; // false let o = true || false; // true let no = !true; // false
- **Estructuras de control condicionales: if, else if, else, switch** if (edad > 18) { console.log("Es mayor de edad"); } else { console.log("Es menor de edad"); } switch (dia) { case 1: console.log("Lunes"); break; case 2: console.log("Martes"); break; default: console.log("Otro día"); }

- **Estructuras de control-bucles: for, while, do...while** for (let i = 0; i < 5; i++) { console.log(i); } let j = 0; while (j < 5) { console.log(j); j++; } let k = 0; do { console.log(k); k++; } while (k < 5);
- **Funciones: define bloques de código reutilizables.** function saludar(nombre) { return "Hola, " + nombre; } let saludo = saludar("Pedro"); console.log(saludo);
- **Funciones anónimas y arrow functions: sintaxis compacta para** funciones. let suma = function(a, b) { return a + b; }; let sumaArrow = (a, b) => a + b;
- **Objetos: colecciones de pares clave-valor.** let persona = { nombre: "Juan", edad: 30, saludar: function() { return "Hola, soy " + this.nombre; } }; console.log(persona.saludar());
- **Arrays: listas ordenadas de elementos.** let numeros = [1, 2, 3, 4, 5]; console.log(numeros[0]); // 1

- **Excepciones: las excepciones son un mecanismo en JavaScript** para manejar errores y condiciones excepcionales en el flujo de un programa. Permiten que el programa reaccione a situaciones inesperadas de manera controlada, evitando que falle de forma abrupta. El manejo de excepciones en JavaScript se realiza mediante las estructuras try, catch, finally y throw. La estructura básica para el manejo de excepciones en JavaScript es try...catch. En el siguiente ejemplo se intenta ejecutar un bloque de código y, si se produce una excepción, se captura y maneja en el bloque catch. try { // Código que puede lanzar una excepción let resultado = dividir(10, 0); console.log(resultado); } catch (error) { // Manejo de la excepción console.error("Se produjo un error:", error.message); } finally { // Código que se ejecuta siempre, ocurra o no una excepción console.log("Operación de división completada."); } function dividir(a, b) { if (b === 0) { throw new Error("No se puede dividir por cero."); } return a / b; }
Pueden lanzarse excepciones propias utilizando la palabra clave "throw". Esto es útil para validar condiciones específicas y manejar errores personalizados.

function validarEdad(edad) { if (edad < 0) { throw new Error("La edad no puede ser negativa."); } return true; }

try { validarEdad(-1); } catch (error) { console.error("Error de validación:", error. message); }

El bloque finally contiene código que se ejecuta siempre, independientemente de si se produce o no una excepción. Resulta útil para liberar recursos o realizar tareas de limpieza.

try { // Código que puede lanzar una excepción let resultado = dividir(10, 2); console.log(resultado); } catch (error) { // Manejo de la excepción console.error("Se produjo un error:", error.message); } finally { // Código que se ejecuta siempre console.log("Operación de división completada."); }

El siguiente ejemplo ilustra el uso de try, catch, finally y throw en una función de conversión de JSON.

function parsearJSON(jsonString) { try { let objeto = JSON.parse(jsonString); console.log("Conversión exitosa:", objeto); } catch (error) { console.error("Error al convertir JSON:", error.message); } finally { console.log("Operación de conversión JSON completada."); } }

let jsonValido = '{"nombre": "Juan", "edad": 30}'; let jsonInvalido = '{"nombre": "Juan", "edad": 30'; // Falta la llave de cierre

parsearJSON(jsonValido); parsearJSON(jsonInvalido);

El manejo de excepciones en JavaScript es una herramienta poderosa para crear aplicaciones robustas y fiables. Mediante el uso de try, catch, finally y throw pueden gestionarse errores de manera efectiva, asegurar la ejecución de código de limpieza y lanzar excepciones personalizadas cuando sea necesario.

### 4.3. Programación orientada a objetos en Javascript

La programación orientada a objetos (POO) es un paradigma de programación que se basa en el concepto de "objetos". Estos pueden contener datos, en forma de campos, a menudo conocidos como atributos o propiedades; y código, en forma de procedimientos, habitualmente conocidos como métodos.

La POO se centra en el diseño y organización del software en torno a estos objetos, facilitando la reutilización de código, la encapsulación y la modularidad.

#### Conceptos Clave de la POO

- **Clase: plantilla o modelo que define las propiedades y comporta-** mientos (métodos) comunes de un conjunto de objetos.
- **Objeto: instancia de una clase. Un objeto es una entidad que tiene** estado (atributos) y comportamiento (métodos).
- **Encapsulación: principio que consiste en ocultar los detalles in-** ternos de un objeto y exponer solo lo necesario a través de una interfaz pública.
- **Herencia: mecanismo por el cual una clase puede heredar propie-** dades y métodos de otra.
- **Polimorfismo: capacidad de los objetos de diferentes clases re-** lacionadas por herencia de responder a la misma interfaz de métodos de diferentes maneras.
JavaScript soporta la POO mediante el uso de prototipos y, más recientemente, con la introducción de la sintaxis de clases en ECMAScript 6 (ES6). A continuación, se explica cómo utilizar la POO en JavaScript.

#### Definición de clases y creación de objetos

Con ES6 se pueden definir clases de manera similar a otros lenguajes de programación orientados a objetos.

// Definición de una clase class Persona { constructor(nombre, edad) {

this.nombre = nombre; this.edad = edad; }

// Método de la clase saludar() { console.log(\`Hola, me llamo \${this.nombre} y tengo \${this.edad} años.\`); } }

// Creación de un objeto (instancia de la clase) const persona1 = new Persona("Juan", 30); persona1.saludar(); // Salida: Hola, me llamo Juan y tengo 30 años.

**Encapsulación**

En JavaScript, la encapsulación se puede lograr utilizando convenciones de nombres (por ejemplo, subrayados) y en ES2020, mediante el uso de campos privados.

class Persona { #nombre; // Campo privado #edad; // Campo privado

constructor(nombre, edad) { this.#nombre = nombre; this.#edad = edad; }

// Método público saludar() { console.log(\`Hola, me llamo \${this.#nombre} y tengo \${this.#edad} años.\`); } }

const persona1 = new Persona("Juan", 30); persona1.saludar(); // Salida: Hola, me llamo Juan y tengo 30 años. // console.log(persona1.#nombre); // Error: campo privado

**Herencia**

JavaScript permite la herencia de clases mediante la palabra clave "extends".

class Persona { constructor(nombre, edad) { this.nombre = nombre; this.edad = edad; }

saludar() { console.log(\`Hola, me llamo \${this.nombre} y tengo \${this.edad} años.\`); } }

// Clase Estudiante que hereda de Persona class Estudiante extends Persona { constructor(nombre, edad, grado) { super(nombre, edad); // Llama al constructor de la clase padre this.grado = grado; }

estudiar() { console.log(\`\${this.nombre} está estudiando en el grado \${this.grado}.\`); } }

const estudiante1 = new Estudiante("Ana", 20, "Segundo Año"); estudiante1.saludar(); // Salida: Hola, me llamo Ana y tengo 20 años. estudiante1.estudiar(); // Salida: Ana está estudiando en el grado Segundo Año.

**Polimorfismo**

Puede lograrse mediante la sobreescritura de métodos en clases derivadas.

class Animal { hacerSonido() { console.log("El animal hace un sonido."); } }

class Perro extends Animal { hacerSonido() { console.log("El perro ladra."); } }

class Gato extends Animal { hacerSonido() { console.log("El gato maúlla."); } }

const animales = [new Animal(), new Perro(), new Gato()];

animales.forEach(animal => { animal.hacerSonido(); // Salida: // El animal hace un sonido. // El perro ladra. // El gato maúlla. });

La programación orientada a objetos en JavaScript permite a los desarrolladores crear aplicaciones más organizadas, modulares y reutilizables. Con la introducción de la sintaxis de clases en ES6, la POO en JavaScript se ha vuelto más accesible y fácil de usar, alineándose más con la forma en que otros lenguajes orientados a objetos implementan estos conceptos. La comprensión y el uso de la POO son fundamentales para el desarrollo de aplicaciones complejas y escalables en JavaScript.

### 4.4. Qué es el DOM

En el desarrollo web, uno de los conceptos clave es el Document Object **Model (DOM). El DOM es una interfaz de programación que permite a** los desarrolladores acceder y manipular el contenido, la estructura y el estilo de los documentos HTML y XML.

Esta interfaz es una representación estructural del documento HTML o XML en forma de un árbol de nodos. Cada elemento, atributo y pieza de contenido dentro de un documento HTML se representa como un nodo en este árbol. El DOM proporciona una API que permite a los lenguajes de programación, como JavaScript, interactuar y modificar la estructura, el estilo y el contenido de los documentos web.

A través del DOM, los desarrolladores pueden crear dinámicamente **contenido web interactivo y responsive, mejorando la experiencia del** usuario.

En este ejemplo puede verse una representación de cómo funciona el DOM en forma de árbol, los elementos de una tabla y al final su contenido. Los programadores pueden acceder a cada nodo del árbol y modificar o transformar cada nodo en función de lo que sea requerido en ese momento.

<table>

<tbody>

<tr> <tr>

<td><td> <td> <td>

Over the river, Shady Grove Aeolian Dorian Charlie

*Estructura de árbol de DOM.*

#### Características principales del DOM

- **Estructura en árbol: el DOM representa el documento como una** estructura jerárquica en forma de árbol, donde cada nodo puede tener hijos. El nodo raíz es el documento mismo y de él cuelgan todos los demás elementos y contenidos.
- **Nodos: son las unidades fundamentales del DOM. Existen varios** tipos de nodos: – **Elementos: representan las etiquetas HTML (por ejemplo,** <div>, <p>, <a>). – **Atributos: representan los atributos de los elementos (por** ejemplo, class, id). – **Texto: representan el contenido textual dentro de los elementos.** – **Comentarios: representan los comentarios en el código HTML.**
- **Accesibilidad y manipulación: a través de lenguajes de progra-** mación como JavaScript, los desarrolladores pueden acceder y manipular cualquier parte del documento. Pueden agregar, modificar o eliminar nodos, cambiar atributos y estilos, y responder a eventos del usuario.
- **Eventos: el DOM permite la creación y gestión de eventos. Los** desarrolladores pueden definir comportamientos específicos en respuesta a acciones del usuario, como clics, desplazamientos o cambios de formulario, entre otros.
- **Compatibilidad con múltiples lenguajes: aunque comúnmente** se asocia con JavaScript, el DOM es un estándar independiente del lenguaje y puede ser manipulado por cualquier lenguaje de programación que pueda interactuar con el navegador.
- **Interactividad y dinamismo: el DOM permite la creación de con-** tenido dinámico e interactivo. Mediante el uso de JavaScript y el DOM, los desarrolladores pueden actualizar partes del documento en respuesta a la interacción del usuario sin necesidad de recargar la página completa.

Un ejemplo común de uso del DOM es la manipulación de elementos HTML mediante JavaScript. A continuación, se muestra un pequeño ejemplo de cómo se puede cambiar el contenido de un elemento <div> mediante JavaScript:

<!DOCTYPE html> <html> <head> <title>Ejemplo de DOM</title> <script> function cambiarContenido() { // Acceder al elemento con id "miDiv" var elemento = document.getElementById("miDiv"); // Cambiar su contenido elemento.innerHTML = "¡El contenido ha cambiado!"; } <\/script> </head> <body> <div id="miDiv">Este es el contenido original.</ div> <button onclick="cambiarContenido()">Cambiar contenido</button> </body> </html>

### 4.5. Uso asíncrono de JavaScript

La asincronía es un concepto fundamental en programación que permite que ciertas operaciones se ejecuten de manera no bloqueante. Esto significa que un programa puede iniciar una operación (como una solicitud de red, lectura de un archivo o acceso a una base de datos) y continuar ejecutando otras tareas sin esperar a que esta operación se complete. Cuando la operación asíncrona termina, el programa es notificado y puede manejar el resultado de dicha operación.

JavaScript es un lenguaje de programación que permite la ejecución asíncrona, lo cual es crucial para manejar operaciones que toman tiempo, como las solicitudes de red, la lectura de archivos y la interacción con bases de datos, sin bloquear la ejecución del programa. Existen varias formas de manejar la asincronía en JavaScript, como callbacks, promesas y la sintaxis async/await introducida en ECMAScript 2017.

La asincronía es una característica poderosa de JavaScript que permite construir aplicaciones eficientes y responsivas. A través de callbacks, promesas y async/await, los desarrolladores tienen diversas herramientas para manejar tareas asíncronas de manera efectiva.

Un callback es una función que se pasa como argumento a otra función y se ejecuta después de que la operación se complete.

function hacerAlgo(callback) { setTimeout(function() { console.log("Operación completada."); callback(); }, 1000); }

function despuesDeHacerAlgo() { console.log("Esto se ejecuta después de la operación."); }

hacerAlgo(despuesDeHacerAlgo); // Salida: // Operación completada. // Esto se ejecuta después de la operación.

Las promesas son objetos que representan la eventual finalización (o falla) de una operación asíncrona y su valor resultante. Proveen métodos then y catch para manejar la resolución o rechazo de la operación.

let miPromesa = new Promise((resolve, reject) => { let exito = true; setTimeout(() => { if (exito) { resolve("Operación exitosa."); } else { reject("Operación fallida."); } }, 1000); });

miPromesa .then((mensaje) => { console.log(mensaje); // Operación exitosa. }) .catch((error) => { console.log(error); });

La sintaxis async/await es una forma más moderna y clara de trabajar con código asíncrono, haciendo que se parezca más a código sincrónico. Async se utiliza para declarar una función asíncrona, y await para esperar a que una promesa se resuelva.

async function hacerSolicitud(url) { try { let respuesta = await fetch(url); if (!respuesta.ok) { throw new Error("Error en la solicitud: " + respuesta.statusText); } let datos = await respuesta.json(); return datos; } catch (error) { console.error("Error:", error); } }

async function procesarDatos() { let url = "[https://jsonplaceholder.typicode.com/](https://jsonplaceholder.typicode.com/) todos/1"; let datos = await hacerSolicitud(url); if (datos) { console.log("Datos obtenidos:", datos); }

}

procesarDatos(); // Salida esperada: // Datos obtenidos: { userId: 1, id: 1, title: "delectus aut autem", completed: false }

El manejo de excepciones en código asíncrono, especialmente con async y await, también es importante. En estos casos, se pueden utilizar try...catch dentro de funciones async.

async function obtenerDatos(url) { try { let respuesta = await fetch(url); if (!respuesta.ok) { throw new Error("Error en la solicitud: " + respuesta.statusText); } let datos = await respuesta.json(); console.log("Datos obtenidos:", datos); } catch (error) { console.error("Error al obtener los datos:", error.message); } }

obtenerDatos("[https://jsonplaceholder.typicode.com/](https://jsonplaceholder.typicode.com/) todos/1"); obtenerDatos("[https://jsonplaceholder.typicode.com/](https://jsonplaceholder.typicode.com/) todos/0"); // URL incorrecta

El manejo de excepciones en código asíncrono es crucial para mantener la estabilidad y la previsibilidad de las aplicaciones modernas.

### 4.6. Frameworks JavaScript

Un framework es una estructura de software que proporciona una base estándar sobre la cual los desarrolladores pueden construir aplicaciones. Ofrece un conjunto de herramientas, bibliotecas y convenciones que facilitan y agilizan el desarrollo de software al proporcionar soluciones predefinidas a problemas comunes.

#### Para + info

Los frameworks ayudan a estandarizar el desarrollo, mejorar la eficiencia y la mantenibilidad del código, y permitir a los desarrolladores enfocarse en las características específicas de su aplicación en lugar de reinventar componentes básicos.

Los frameworks de JavaScript como Angular, React, Vue.js, Ember.js y Svelte proporcionan herramientas y estructuras poderosas para desarrollar aplicaciones web modernas y eficientes. Cada uno tiene sus propias características y fortalezas, lo que permite a los desarrolladores elegir el que mejor se adapte a sus necesidades específicas y al tipo de proyecto que están desarrollando. Estos frameworks no sólo simplifican el proceso de desarrollo, sino que también ayudan a mantener el código organizado, escalable y mantenible.

**Angular**

Es un framework de desarrollo de aplicaciones web de código abierto mantenido por Google. Está diseñado para construir aplicaciones web dinámicas y robustas con una arquitectura basada en componentes y una fuerte integración con TypeScript.

Características:

- Arquitectura basada en componentes.
- Data binding bidireccional.
- Inyección de dependencias.
- Soporte integral para testing.
- Herramientas de desarrollo y CLI.
**Vue.js**

Se trata de un framework progresivo utilizado para construir interfaces de usuario. Se puede integrar fácilmente con otros proyectos y bibliotecas y es conocido por su enfoque incremental y su curva de aprendizaje amigable.

Características:

- Data binding bidireccional.
- Sistema de componentes reactivos.
- Enfoque modular y combinable..
- Herramientas oficiales como Vue Router y Vuex.
- Documentación extensa y amigable.
**Ember.js**

Es un framework pensado para construir aplicaciones web ambiciosas. Es conocido por su enfoque en la productividad del desarrollador y sus convenciones estrictas que ayudan a mantener el código organizado y predecible.

Características:

- Enrutamiento avanzado.
- Data binding bidireccional.
- Sistema de plantillas basado en Handlebars.
- Herramientas integradas como Ember CLI.
- Convenciones sobre configuración.

**Svelte**

Consiste en un framework moderno que se diferencia de otros al compilar el código en componentes altamente eficientes durante la construcción, eliminando la necesidad de un framework en tiempo de ejecución.

Características:

- Compilación a código altamente eficiente.
- Sintaxis concisa y fácil de aprender.
- Reactividad integrada sin necesidad de estado global.
- No hay necesidad de Virtual DOM.
- Tamaño de bundle reducido.
**React**

Aunque técnicamente es una biblioteca, React es a menudo considerado un framework debido a su ecosistema robusto. Desarrollado por Facebook, React se centra en la construcción de interfaces de usuario con una arquitectura basada en componentes.

Características:

- Arquitectura basada en componentes.
- Virtual DOM para un rendimiento eficiente.
- Unidirectional data flow.
- JSX para la escritura de componentes.
- Ecosistema rico con herramientas como React Router y Redux.
A continuación, se muestra un ejemplo básico de una aplicación React que incluye la creación de un componente, el uso del estado y la gestión de eventos.

#### Ejemplo de aplicación React

#### Paso 1: instalación y configuración inicial

Para comenzar con React, Node.js y npm deben estar instalados en el sistema. Luego, puede crearse una nueva aplicación React utilizando Create React App:

npx create-react-app mi-aplicacion-react cd mi-aplicacion-react

#### Se inicia el servidor de desarrollo:

npm start

Debe abrirse el navegador y visitar [http://localhost:3000/](http://localhost:3000/) para ver la aplicación React en funcionamiento.

#### Paso 2: creación de un componente
